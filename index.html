        ${alsoHappening.length? '<div style="margin-top:16px;border-radius:14px;background:var(--wash);padding:14px 16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0">Also happening right now — live</p><span style="display:inline-flex;flex-shrink:0;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--red)"><span class="tk-livedot" style="display:inline-block;height:7px;width:7px;border-radius:999px;background:var(--red)" aria-hidden="true"></span>Live</span></div>'
          + '<ul style="list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px">' + alsoHappening.map(a => '<li class="tk-liveact"><span class="tk-livedot" style="margin-top:7px;height:8px;width:8px;flex-shrink:0;border-radius:999px;background:var(--accent)" aria-hidden="true"></span><span style="min-width:0"><span style="display:flex;flex-wrap:wrap;align-items:center;gap:6px"><span class="tk-surfpill">' + esc(a.surface) + '</span><span class="tk-actpill accent">' + esc(a.action) + '</span></span><span style="margin-top:4px;display:block;word-break:break-word;line-height:1.4;color:var(--ink-2)">' + esc(a.detail) + '</span></span></li>').join("") + '</ul>'
          + '<p style="margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--dim)">Each line is the exact search or posting that surface is working on at this moment — it updates on every refresh as the hunt moves.</p></div>'
          : engineFresh? '<p style="margin-top:12px;font-size:14.5px;color:var(--dim)" role="status">Nothing else happening right now — only the work above is in progress at this moment.</p>' : ""}
        ${latestNote? '<p style="margin-top:12px;word-break:break-word;font-size:14px;line-height:1.55;color:var(--ink-2)"><span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)">Latest from the hunt · </span>' + esc(latestNote) + '</p>' : ""}
        ${titlesNow.length? '<div style="margin-top:16px"><p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0">Searching these titles now</p><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">' + titlesNow.slice(0, 12).map(t => '<span class="tk-titlepill"><span class="tk-livedot" style="display:inline-block;height:7px;width:7px;flex-shrink:0;border-radius:999px;background:#fff" aria-hidden="true"></span>' + esc(t) + '</span>').join("") + (titlesNow.length > 12? '<span style="font-size:13.5px;color:var(--dim)">+' + (titlesNow.length - 12) + ' more</span>' : '') + '</div></div>' : ""}
        ${!engineFresh? '<p style="margin-top:12px;font-size:14.5px;line-height:1.55;color:var(--dim)">The engine is idle right now. When a search starts, this panel shows what it is viewing and searching, as it happens.</p>' : ""}
        <p style="margin-top:16px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--dim)">Updated ${esc(tkFull(STORE.runs.updated_at || new Date().toISOString()))} · refreshes with the page every minute</p>
      </div>
    </div>
  </section>
  <section aria-label="Today’s totals" class="tk-section">
    <h2 class="tk-h2">Today · ${esc(tkDay(todayStr()))}</h2>
    <div class="tk-todaygrid">
      <button type="button" class="tk-todaycard tk-frosted-green tk-float" data-panelcard="filed" aria-expanded="${DASH_UI.panel === "filed"}" aria-label="${counts.filed} filed today. Tap to ${DASH_UI.panel === "filed"? "hide" : "see"} all filed positions today" style="align-items:center">
        ${tkGauge(counts.filed, "green")}
        <span class="tk-tlabel" style="color:var(--green-ink)">Filed</span>
        <span class="tk-tap" style="color:var(--green-ink)">Tap to see all filed today ${chev(DASH_UI.panel === "filed")}</span>
        ${pillRow(filedPills, "var(--green-ink)", "Today’s filed applications by source")}
      </button>
      <div class="tk-todaycard tk-float" style="background:var(--surface);align-items:center">
        ${tkGauge(evaluated, "accent")}
        <span class="tk-tlabel" style="color:var(--ink-2)">Evaluated</span>
        <div class="tk-funnelbox" role="img" aria-label="${incoming.length && engineFresh? "Animation of applications dropping into a funnel to be evaluated" : "Funnel the evaluated applications passed through — still while no live titles are coming in"}">
          ${incoming.length && engineFresh? '<span class="tk-funnelchip tk-funnelapp" style="left:14px;animation-delay:0s;--funnel-x:38px;background:var(--accent)" aria-hidden="true"></span><span class="tk-funnelchip tk-funnelapp" style="left:53px;animation-delay:.75s;--funnel-x:0px;background:var(--accent-2)" aria-hidden="true"></span><span class="tk-funnelchip tk-funnelapp" style="left:91px;animation-delay:1.5s;--funnel-x:-38px;background:var(--green)" aria-hidden="true"></span>' : ""}
          <svg viewBox="0 0 124 62" style="position:absolute;bottom:0;left:0;display:block;height:62px;width:124px" aria-hidden="true"><path d="M6 6 H118 L72 32 V52 H52 V32 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" class="${incoming.length && engineFresh? "tk-funnelglow" : ""}"></path><path d="M22 15 H102" stroke="var(--accent)" stroke-width="1.5" opacity="0.45"></path><path d="M38 23 H86" stroke="var(--accent)" stroke-width="1.5" opacity="0.35"></path></svg>
        </div>
        <div style="font-size:12.5px;font-weight:600;color:var(--dim)">${incoming.length && engineFresh? "Applications coming in" : "Applications evaluated"}</div>
        <div class="tk-incomingpill" role="status" aria-live="polite">${incoming.length && engineFresh? '<span class="tk-incoming" id="tkIncomingTitle">' + esc(incoming[DASH_UI.funnelIdx % incoming.length]) + '</span>' : '<span class="dim">' + (engineFresh? "No verified live titles right now" : runLive? "The last run stalled — no titles coming in" : runs.state === "stopped"? "The last run stopped early" : lastRun? "Hunt finished — no titles coming in" : "No hunt is running — no titles coming in") + '</span>'}</div>
      </div>
      <button type="button" class="tk-todaycard tk-frosted-amber tk-float" data-panelcard="parked" aria-expanded="${DASH_UI.panel === "parked"}" aria-label="${counts.parked} parked today. Tap to ${DASH_UI.panel === "parked"? "hide" : "see"} all parked jobs today and why each was parked" style="text-align:left">
        ${tkGauge(counts.parked, "amber")}
        <span class="tk-tlabel" style="color:var(--amber-ink)">Parked</span>
        <span class="tk-tap" style="color:var(--amber-ink)">Tap to see all parked today ${chev(DASH_UI.panel === "parked")}</span>
        ${pillRow(parkedPills, "var(--amber-ink)", "Today’s parked leads by source").replace("tk-cardpills", "tk-cardpills left")}
      </button>
      <button type="button" class="tk-todaycard tk-frosted-red tk-float" data-panelcard="rejected" aria-expanded="${DASH_UI.panel === "rejected"}" aria-label="${counts.rejected} rejected today. Tap to ${DASH_UI.panel === "rejected"? "hide" : "see"} all rejected jobs today and why each was rejected" style="text-align:left">
        ${tkGauge(counts.rejected, "red")}
        <span class="tk-tlabel" style="color:var(--red-ink)">Rejected</span>
        <span class="tk-tap" style="color:var(--red-ink)">Tap to see all rejected today ${chev(DASH_UI.panel === "rejected")}</span>
        ${pillRow(rejectedPills, "var(--red-ink)", "Today’s rejected leads by source").replace("tk-cardpills", "tk-cardpills left")}
      </button>
    </div>
    <div id="filingsBox"></div>
    ${runTotals}
  </section>
  <section aria-label="Step by step" class="tk-section">
    <h2 class="tk-h2">Step by step</h2>
    <p class="tk-sub" style="margin-top:-8px;margin-bottom:16px;max-width:640px">What happened at each step of this run — finished steps first, then the steps live now, then the steps still waiting. Tap any step to see its detail right here — the step marked Live now expands to show exactly what it is doing at this moment.</p>
    <ol class="tk-card" style="list-style:none;margin:0;padding:8px 20px" aria-label="Every step of this run, finished first, then live, then waiting">${stageRows}</ol>
  </section>`;

  /* ----- search coverage ----- */
  const laneStates = (saved.lanes || []).map(l => laneState(l));
  const covCounts = { searching: 0, done: 0, stopped: 0, blocked: 0, manual: 0 };
  laneStates.forEach(s => {
    if(s.word === "Searching") covCounts.searching++;
    else if(s.word === "Done") covCounts.done++;
    else if(s.word === "Stopped") covCounts.stopped++;
    else if(s.word === "Blocked") covCounts.blocked++;
    else if(s.word === "Manual") covCounts.manual++;
  });
  const covSummary = (covCounts.searching? covCounts.searching + " searching · " : "") + covCounts.done + " finished"
    + (covCounts.stopped? " · " + covCounts.stopped + " stopped early" : "") + (covCounts.blocked? " · " + covCounts.blocked + " blocked" : "")
    + (covCounts.manual? " · " + covCounts.manual + " manual" : "");
  const tiles = (saved.lanes || []).map((lane, idx) => {
    const s = laneStates[idx];
    const selected = DASH_UI.selLanes.includes(lane.name);
    const prio = (STORE.runs.lane_controls || []).some(c => c.lane === lane.name && c.action === "priority");
    const cls = s.tone === "green"? "tk-frosted-green" : s.tone === "amber"? "tk-frosted-amber" : s.tone === "red"? "tk-frosted-red" : "track";
    const statusInk = s.tone === "red"? "font-weight:600;color:var(--red-ink)" : s.tone === "green"? "color:var(--green-ink)" : s.tone === "amber"? "font-weight:600;color:var(--amber-ink)" : "color:var(--ink-2)";
    const unitLine = lane.kind === "board"? "Searched in your browser" : s.done + "/" + s.total + " employers searched";
    const barColor = s.tone === "amber"? "var(--amber)" : s.tone === "green"? "var(--green)" : s.tone === "red"? "var(--red)" : "var(--dim)";
    return '<li style="height:100%"><button type="button" class="tk-tile ' + cls + (selected? " selected" : "") + '" data-tile="' + idx + '" '
      + (DASH_UI.selecting? 'aria-pressed="' + selected + '"' : 'aria-expanded="' + (OPEN_LANE === idx) + '"')
      + ' aria-label="' + esc(lane.name) + ': ' + esc(s.word) + ' · ' + esc(unitLine) + (s.detail? '. ' + esc(s.detail) : '') + (DASH_UI.selecting? '. Tap to ' + (selected? "deselect" : "select") + ' this lane' : '. Tap to see all the websites and jobs for this lane') + '">'
      + (DASH_UI.selecting? '<span class="tk-checkbadge' + (selected? " on" : "") + '" aria-hidden="true"><svg viewBox="0 0 12 12" style="display:block;height:12px;width:12px" fill="none"><path d="M2 6.5 4.8 9 10 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>' : "")
      + '<span class="tk-tilename"' + (DASH_UI.selecting? ' style="padding:0 24px"' : '') + '>' + esc(lane.name)
      + (prio? '<span class="tk-prioritytag">PRIORITY</span>' : '')
      + (DASH_UI.selecting && selected? '<span class="tk-selectedtag">✓ SELECTED</span>' : '') + '</span>'
      + '<span style="margin-top:12px" role="img" aria-label="' + esc(lane.name) + ' coverage ' + s.pct + '%">' + tkDonut(s.pct, s.tone) + '</span>'
      + '<span class="tk-tilestatus" style="' + statusInk + '">'
      + (s.word === "Searching"? '<span class="tk-spinner tk-spin" aria-hidden="true"></span>' : '<span class="tk-dot8" style="background:' + (s.tone === "red"? "var(--red)" : s.tone === "green"? "var(--green)" : "var(--dim)") + '" aria-hidden="true"></span>')
      + esc(s.word) + ' · ' + esc(unitLine) + '</span>'
      + '<span style="margin-top:6px;display:block;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-2)">' + esc(unitLine) + '</span>'
      + (s.word === "Searching" && s.detail? '<span style="margin-top:6px;display:block;word-break:break-word;font-size:13px;line-height:1.4;color:var(--amber-ink)">Searching now: ' + esc(s.detail.length > 120? s.detail.slice(0, 120) + "…" : s.detail) + '</span>' : "")
      + '<span class="tk-bar" role="progressbar" aria-label="' + esc(lane.name) + ' coverage progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + s.pct + '"><span class="tk-bartrack"><span class="tk-barfill' + (s.word === "Searching"? " tk-barlive" : "") + '" style="width:' + s.pct + '%;background:' + barColor + '"></span></span></span>'
      + ((lane.sites || []).length? '<span class="tk-sitesline">' + (lane.sites || []).length + ' sites</span>' : "")
      + '</button></li>';
  }).join("");
  const selLaneObjs = (saved.lanes || []).filter(l => DASH_UI.selLanes.includes(l.name));

  /* ----- titles ----- */
  const allTitles = saved.titles || [];
  const removedTitles = Array.isArray(STORE.coverage.removed_titles)? STORE.coverage.removed_titles : [];
  const addedTitles = Array.isArray(STORE.coverage.added_titles)? STORE.coverage.added_titles : [];
  const lastRunTitles = new Set(((lastRun && lastRun.titles) || []).map(t => String(t).toLowerCase()));
  const searchedCount = allTitles.filter(t => lastRunTitles.has(String(t).toLowerCase())).length;
  const searchingTitlesNow = engineFresh? titlesNow : [];
  const scopeReq = (runs.requests || []).filter(r => r.kind === "title-scope").pop();
  const chipHtml = t => {
    const isAdded = addedTitles.some(x => x.toLowerCase() === String(t).toLowerCase());
    const searched = lastRunTitles.has(String(t).toLowerCase());
    const addedTag = isAdded? '<span class="tk-addedtag">Added by you</span>' : "";
    const rmBtn = '<button type="button" class="tk-chiprm" data-titleremove="' + esc(t) + '" aria-label="Remove title ' + esc(t) + '">✕</button>';
    if(DASH_UI.selectingTitles){
      const on = DASH_UI.selTitles.includes(t);
      return '<span role="listitem" class="tk-chip selectable' + (on? " on" : "") + '"><button type="button" class="tk-chipmain" data-titleselect="' + esc(t) + '" aria-pressed="' + on + '" style="' + (on? "font-weight:700;color:#fff" : "font-weight:500;color:var(--ink-2);opacity:.85") + '">' + (on? "✓ " : "") + esc(t) + (isAdded? '<span class="tk-addedtag"' + (on? ' style="background:rgba(255,255,255,.25);color:#fff"' : '') + '>Added by you</span>' : "") + '</button>' + rmBtn + '</span>';
    }
    return '<span role="listitem" class="tk-chip ' + (searched? "searched" : "not") + '" aria-label="' + esc(t) + (isAdded? " (added by you)" : "") + ': ' + (searched? "searched" : "not searched yet") + '">' + (searched? "✓ " : "") + esc(t) + addedTag + rmBtn + '</span>';
  };

  /* ----- rules ----- */
  const R = STORE.rules;
  const rulesSetCount = (R.remote_only? 1 : 0) + (R.minimum_pay? 1 : 0) + ((R.always_reject || []).length? 1 : 0) + ((R.focus_sectors || []).length? 1 : 0) + (R.extra_notes? 1 : 0);
  const rulesDefault = R.remote_only && !R.minimum_pay && !(R.always_reject || []).length && !(R.focus_sectors || []).length && !R.extra_notes;
  const rulesPill = rulesDefault? '<span class="tk-countpill green">Standard hunt rules</span>' : '<span class="tk-countpill accent">Custom — ' + rulesSetCount + ' of 5 rules set</span>';
  const ruleRow = (name, desc, control, tag) => '<li style="display:flex;align-items:flex-start;gap:8px;padding:12px 0;border-top:1px solid var(--border)">' + control
    + '<span style="min-width:0;flex:1"><span style="display:block;font-size:15px;font-weight:600">' + esc(name) + (tag? '<span style="margin-left:8px;border-radius:999px;background:var(--bar-track);padding:1px 8px;font-size:11.5px;font-weight:700;color:var(--ink-2)">' + esc(tag) + '</span>' : '') + '</span>'
    + '<span style="margin-top:2px;display:block;font-size:13.5px;line-height:1.55;color:var(--ink-2)">' + desc + '</span></span></li>';

  tkHtml += `
  <section aria-label="Search coverage" class="tk-section">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
      <h2 class="tk-h2" style="margin:0">Search coverage</h2>
      <div style="margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px">
        <p style="font-size:12px;color:var(--dim);margin:0">${esc(covSummary)}</p>
        <button type="button" class="tk-selbtn ${DASH_UI.selecting? "accent" : "accentsoft"}" id="btnSelectLanes" aria-pressed="${DASH_UI.selecting}" aria-label="${DASH_UI.selecting? "Done selecting lanes" : "Select lanes to mark priority or restart"}">${DASH_UI.selecting? "Done" : "Select"}</button>
      </div>
    </div>
    <p class="tk-sub" style="margin-top:-8px;margin-bottom:16px">${DASH_UI.selecting? "Tap lanes to select them — tap again to deselect. Then mark them priority or restart their searches below." : "Tap a lane to see all the websites in that lane, plus every job for it. Tap Select to choose lanes and mark them priority or restart them together."}</p>
    <p style="margin-top:-4px;margin-bottom:12px;font-size:14px;line-height:1.55;color:var(--ink-2)">Every lane is searched with all ${allTitles.length} titles below — each card counts the employers it has covered.</p>
    <div style="margin-top:-4px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--dim)" aria-label="Coverage card colour key">
      <span style="display:inline-flex;align-items:center;gap:6px"><span class="tk-dot8" style="background:var(--green)" aria-hidden="true"></span> Green — done</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span class="tk-dot8" style="background:var(--amber)" aria-hidden="true"></span> Amber — searching now</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span class="tk-dot8" style="background:var(--red)" aria-hidden="true"></span> Red — blocked or stopped</span>
    </div>
    ${DASH_UI.selecting? '<div style="margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px"><button type="button" class="tk-selbtn accentsoft" id="btnLanesSelectAll">Select all</button><button type="button" class="tk-selbtn" style="background:var(--bar-track);color:var(--ink-2)" id="btnLanesClear" ' + (DASH_UI.selLanes.length? "" : "disabled") + '>Clear selection</button><span style="font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--dim)" role="status">' + (DASH_UI.selLanes.length? DASH_UI.selLanes.length + " selected" : "No lanes selected") + '</span></div>' : ""}
    <div class="tk-card" style="border-radius:28px;padding:24px">
      ${(saved.lanes || []).length? '<ul class="tk-tilegrid" aria-label="Search coverage by lane">' + tiles + '</ul>' : '<p class="tk-sub">No saved lanes yet — coverage is created in setup step 4.</p>'}
    </div>
    ${DASH_UI.selecting && DASH_UI.selLanes.length? '<div class="tk-card" style="margin-top:16px;padding:20px 22px" aria-label="Selected lanes actions">'
      + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px"><h3 style="font-size:17px;font-weight:700;margin:0">' + DASH_UI.selLanes.length + ' ' + (DASH_UI.selLanes.length === 1? "lane" : "lanes") + ' selected</h3><span style="min-width:0;word-break:break-word;font-size:13.5px;color:var(--dim)">' + esc(selLaneObjs.map(l => l.name).join(" · ")) + '</span></div>'
      + '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="tk-rowbtn accent" id="btnPrioritySelected" style="padding:10px 20px;font-size:15.5px">Mark selected as priority</button>'
      + '<button type="button" class="tk-rowbtn accentsoft" id="btnRestartSelected" style="padding:10px 20px;font-size:15.5px">Restart selected searches</button>'
      + '<button type="button" class="tk-rowbtn track" id="btnClearLaneSel" style="padding:10px 20px;font-size:15.5px">Clear selection</button></div>'
      + (DASH_UI.lanesMsg? '<p class="tk-statusline" style="margin-top:12px" role="status">' + esc(DASH_UI.lanesMsg) + '</p>' : "") + '</div>' : ""}
    <div id="lanePanel"></div>
  </section>
  <section aria-label="Titles searched" class="tk-section">
    <h2 style="margin:0 0 16px"><button type="button" id="btnTitlesFold" aria-expanded="${!DASH_UI.titlesFolded}" style="display:flex;width:100%;cursor:pointer;align-items:center;gap:12px;border:0;background:transparent;padding:0;text-align:left;font-family:inherit">
      <span style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--dim)">Titles searched</span>
      ${lastRun? '<span class="tk-countpill green">' + searchedCount + ' of ' + allTitles.length + ' searched</span>' : ""}
      ${(addedTitles.length || removedTitles.length)? '<span class="tk-countpill accent">' + allTitles.length + ' titles — ' + (allTitles.length - addedTitles.length) + ' standard' + (addedTitles.length? ' + ' + addedTitles.length + ' added' : '') + (removedTitles.length? ' · ' + removedTitles.length + ' removed' : '') + '</span>' : ""}
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="tk-foldchev ${DASH_UI.titlesFolded? "closed" : ""}"><path d="M5 7.5 10 12.5 15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button></h2>
    <div style="margin-top:-4px;margin-bottom:16px">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
        <button type="button" class="tk-selbtn ${DASH_UI.selectingTitles? "accent" : "accentsoft"}" id="btnSelectTitles" aria-pressed="${DASH_UI.selectingTitles}">${DASH_UI.selectingTitles? "Done" : "Select titles"}</button>
        <button type="button" class="tk-selbtn ${DASH_UI.addTitlesOpen? "accent" : "accentsoft"}" id="btnAddTitlesToggle" aria-pressed="${DASH_UI.addTitlesOpen}">Add titles</button>

function laneProgress(lane){
  const runs = STORE.runs;
  const entry = ((runs.current_run && runs.current_run.lanes) || []).find(x => x.name === lane.name);
  if(entry && entry.total) return Math.max(0, Math.min(100, Math.round(100 * (entry.done||0) / entry.total)));
  if(runs.state === "idle" && runs.history && runs.history.length) return 100;
  return 0;
}

async function laneControl(lane, action){
  try{
    STORE.runs.lane_controls = Array.isArray(STORE.runs.lane_controls)? STORE.runs.lane_controls: [];
    STORE.runs.lane_controls.push({ id: uid("ctl"), lane: lane.name, action, at: nowISO() });
    await storeSave("runs", "Lane control: "+action+" "+lane.name);
    await logActivity("control", "Lane control recorded: "+action+" on “"+lane.name+"” — written into runs.json for the next run.");
    const m = $("#laneCtlMsg"); if(m) m.innerHTML = '<div class="notice ok">'+esc(action === "priority"? "Priority toggled" : "Restart requested")+' for '+esc(lane.name)+' — saved in runs.json.</div>';
  }catch(e){ const m = $("#laneCtlMsg"); if(m) m.innerHTML = '<div class="notice err">'+esc(e.message||String(e))+'</div>'; }
}

/* ---------- mailbox sign-in + automatic code fetching ----------
   The user signs in with their provider: Google/Microsoft run the sign-in on their own pages and
   hand this page a read-only mail token. Tokens live ONLY in this browser (localStorage), never
   in the repo — the same rule as the GitHub token. connections.json records the provider, email
   and the app-registration client ID (an identifier, not a secret) so setup survives. */
/* mailbox sign-in is saved PER PROFILE — scoped to the connected account's repo */
const MAIL_KEY = "getMeAJobMail";
function mailKey(){
  const a = accountLoad() || {};
  const owner = (GH && GH.owner) || a.owner || "";
  const repo = (GH && GH.repo) || a.repo || "";
  return owner? MAIL_KEY + ":" + owner + "/" + repo : MAIL_KEY;
}
function mailTokenLoad(){
  try{
    const k = mailKey();
    let raw = localStorage.getItem(k);
    if(!raw && k !== MAIL_KEY){
      /* one-time adoption: a token saved before per-profile scoping belongs to the profile that signs in first */
      const legacy = localStorage.getItem(MAIL_KEY);
      if(legacy){ localStorage.setItem(k, legacy); localStorage.removeItem(MAIL_KEY); raw = legacy; }
    }
    return raw? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function mailTokenSave(t){ try{ localStorage.setItem(mailKey(), JSON.stringify(t)); }catch(e){} }
function mailTokenClear(){ try{ localStorage.removeItem(mailKey()); }catch(e){} }
/* Publisher-provided shared app registrations: filled in ONCE by whoever publishes the app,
   after which every user's Connect is a single click — no per-user app registration.
   Client IDs are public identifiers, not secrets. A user's own client ID always wins. */
const SHARED_MAIL_CLIENT_IDS = { Gmail: "", Outlook: "" };
function mailClientId(provider){
  const mb = STORE.connections.mailbox;
  const own = (mb && mb.provider === provider)? (mb.client_id || "") : "";
  return (own || SHARED_MAIL_CLIENT_IDS[provider] || "").trim();
}
function mailTokenValid(){
  const t = mailTokenLoad();
  if(!t || !t.provider) return null;
  if(t.provider === "Outlook") return t; /* MSAL manages its own token lifecycle */
  return (t.access_token && (!t.expires_at || Date.now() < t.expires_at - 30000))? t : null;
}
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Could not load " + src));
    (document.head || document.documentElement).appendChild(s);
  });
}
/* --- Gmail (Google Identity Services token client; read-only scope) --- */
async function ensureGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return;
  await loadScriptOnce("https://accounts.google.com/gsi/client");
  if(!(window.google && google.accounts && google.accounts.oauth2)) throw new Error("Google sign-in did not load — check your connection and try again.");
}
function gisToken(clientId, prompt){
  return new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: "https://www.googleapis.com/auth/gmail.readonly",
      callback: resp => { if(resp && resp.access_token) resolve(resp); else reject(new Error("Google sign-in was cancelled or did not return a token.")); },
      error_callback: err => reject(new Error("Google sign-in failed (" + ((err && err.type) || "unknown") + ")."))
    });
    client.requestAccessToken({ prompt: prompt || "" });
  });
}
async function connectGmail(clientId){
  await ensureGis();
  const token = await gisToken(clientId, "consent");
  mailTokenSave({ provider:"Gmail", access_token: token.access_token, expires_at: Date.now() + (token.expires_in || 3600) * 1000 });
  const prof = await gmailApi("/profile");

async function reauthGmail(clientId){

}
function gmailApi(path, token){
  const t = token || (mailTokenLoad() || {}).access_token;
  return fetch("https://gmail.googleapis.com/gmail/v1/users/me" + path, { headers:{ Authorization: "Bearer " + t } })
    .then(r => { if(!r.ok) throw new Error("Gmail API answered " + r.status + " — reconnect your mailbox if this persists."); return r.json(); });
}
/* --- Outlook (MSAL public client; read-only scopes; PKCE, no secret) --- */
let MSAL_APP = null;
async function ensureMsal(clientId){

async function outlookToken(){

function graphApi(path, token){

    .then(r => { if(!r.ok) throw new Error("Microsoft Graph answered " + r.status + " — reconnect your mailbox if this persists."); return r.json(); });
}
async function connectMailbox(){

  if(mb.provider === "Other") throw new Error("Automatic code fetching supports Gmail and Outlook. Other mailboxes keep the manual fallback in the Code Inbox.");

/* --- code extraction + fetching --- */
function extractCodeFromText(text){
  const t = String(text || "");
  const pats = [
    /(?:verification|security|one[- ]?time|access|sign[- ]?in|login|confirmation|authentication)[^0-9a-z]{0,40}?(\d{4,8})\b/i,
    /\bcode[^0-9a-z]{0,20}?(\d{4,8})\b/i,
    /\b(\d{6})\b/
  ];
  for(const p of pats){ const m = t.match(p); if(m) return m[1]; }
  return "";
}
function serviceName(from){
  const s = String(from || "");
  const named = s.match(/^"?([^"<@]+?)"?\s*</);
  if(named && named[1].trim()) return named[1].trim();
  const dom = s.match(/@([a-z0-9.-]+)/i);
  return dom? dom[1].replace(/^www\./, "") : "Mailbox";
}
async function gmailFetchCodes(token){
  const q = encodeURIComponent('newer_than:2d (verification OR code OR "one-time" OR passcode OR otp OR "sign-in" OR security)');
  const list = await gmailApi("/messages?maxResults=12&q=" + q, token);
  const out = [];
  for(const m of (list.messages || [])){
    const msg = await gmailApi("/messages/" + m.id + "?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date", token);
    const headers = {};
    (((msg.payload || {}).headers) || []).forEach(h => { headers[String(h.name).toLowerCase()] = h.value; });
    const code = extractCodeFromText((headers.subject || "") + " " + (msg.snippet || ""));
    if(!code) continue;
    let when = nowISO();
    if(headers.date){ const d = new Date(headers.date); if(!isNaN(d)) when = d.toISOString(); }
    out.push({ service: serviceName(headers.from || ""), code: code, received_at: when });
  }
  return out;
}
async function graphFetchCodes(token){
  const data = await graphApi("/me/messages?$top=15&$orderby=receivedDateTime%20desc&$select=subject,from,receivedDateTime,bodyPreview", token);
  const out = [];
  (data.value || []).forEach(msg => {
    const hay = (msg.subject || "") + " " + (msg.bodyPreview || "");
    if(!/code|verif|one-time|otp|passcode|sign-in|security/i.test(hay)) return;
    const code = extractCodeFromText(hay);
    if(!code) return;
    const ea = (msg.from && msg.from.emailAddress) || {};
    out.push({ service: serviceName(ea.name || ea.address || ""), code: code, received_at: msg.receivedDateTime || nowISO() });
  });
  return out;
}
/* --- application-confirmation matching (user opt-in): confirmation emails in the connected
       mailbox are matched to parked leads and filed automatically, with the email itself kept as
       the filing proof. Conservative matcher: a confirmation pattern, a distinctive company
       match, and role disambiguation when one company has several parked leads. --- */
const CONFIRM_RE = /thank you for applying|thanks for applying|thank you for your application|we have received your application|we've received your application|your application has been received|your application was received|your application has been submitted|your application was submitted|application received|application submitted|successfully submitted|you have successfully applied|you've successfully applied|application confirmation/i;
const CONFIRM_EXCLUDE_RE = /job alert|jobs you may like|new jobs|recommended for you|is hiring|apply now|don'?t miss|interview invitation|recruiter/i;
function confNorm(s){
  return String(s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
}
const CONF_GENERIC = new Set(["health","healthcare","care","systems","system","solutions","solution","group","technologies","technology","services","service","global","insurance","energy","labs","lab","medical","center","centre","hospital","university","bank","financial","consulting","partners","partner","staffing","resources","resource","network","networks","cloud","data","digital","software","inc","llc","ltd","corp","corporation","company","co","the","and","of"]);
function confTokens(s){ return confNorm(s).split(" ").filter(w => w && !CONF_GENERIC.has(w)); }
function confCompanyMatch(company, hayNorm){
  const toks = confTokens(company);
  if(!toks.length) return confNorm(company).length > 2 && hayNorm.includes(confNorm(company));
  return toks.every(t => (" " + hayNorm + " ").includes(" " + t + " "));
}
function matchConfirmations(messages, parked){
  const out = [];
  const used = new Set();
  const groups = {};
  (parked || []).forEach(f => { const k = confNorm(f.company); (groups[k] = groups[k] || []).push(f); });
  (messages || []).forEach(m => {
    const subject = m.subject || "";
    if(!CONFIRM_RE.test(subject + " " + (m.snippet || ""))) return;
    if(CONFIRM_EXCLUDE_RE.test(subject)) return;
    const hay = confNorm((m.from || "") + " " + subject + " " + (m.snippet || ""));
    const cands = (parked || []).filter(f => !used.has(f.id) && confCompanyMatch(f.company, hay));
    if(!cands.length) return;
    /* a company with several parked leads at scan start always needs role evidence —
       a generic "application received" must never guess which lead it belongs to */
    const multi = cands.some(f => (groups[confNorm(f.company)] || []).length > 1);
    let pick = null;
    if(cands.length === 1 && !multi) pick = cands[0];
    else {
      let best = -1;
      cands.forEach(f => {
        const rt = confTokens(f.role).concat(confNorm(f.role).split(" ").filter(w => w.length >= 5));
        const score = rt.filter(t => (" " + hay + " ").includes(" " + t + " ")).length;
        if(score > best){ best = score; pick = f; }
        else if(score === best){ pick = null; }
      });
      if(best <= 0) pick = null;
    }
    if(pick){ used.add(pick.id); out.push({ message: m, filing: pick }); }
  });
  return out;
}
async function gmailFetchConfirmations(token){
  const q = encodeURIComponent('newer_than:14d (application OR applying OR applied OR "thank you") -"job alert"');
  const list = await gmailApi("/messages?maxResults=25&q=" + q, token);
  const out = [];
  for(const m of (list.messages || [])){
    const msg = await gmailApi("/messages/" + m.id + "?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date", token);
    const headers = {};
    (((msg.payload || {}).headers) || []).forEach(h => { headers[String(h.name).toLowerCase()] = h.value; });
    let when = nowISO();
    if(headers.date){ const d = new Date(headers.date); if(!isNaN(d)) when = d.toISOString(); }
    out.push({ id: m.id, from: headers.from || "", subject: headers.subject || "", snippet: msg.snippet || "", received_at: when });
  }
  return out;
}
async function graphFetchConfirmations(token){
  const data = await graphApi("/me/messages?$top=30&$orderby=receivedDateTime%20desc&$select=id,subject,from,receivedDateTime,bodyPreview", token);
  return (data.value || []).map(msg => {
    const ea = (msg.from && msg.from.emailAddress) || {};
    return { id: msg.id, from: (ea.name || "") + " <" + (ea.address || "") + ">", subject: msg.subject || "", snippet: msg.bodyPreview || "", received_at: msg.receivedDateTime || nowISO() };
  });
}
let CONFIRM_SCAN_DONE = false;
async function fetchConfirmationMatches(opts){
  opts = opts || {};
  const mb = STORE.connections.mailbox;
  if(!mb || !mb.connected) return { converted: 0, reason: "not-connected" };
  if(mb.confirmation_matching === false) return { converted: 0, reason: "off" };
  let messages = [];
  try{
    if(mb.provider === "Gmail"){
      let tok = mailTokenValid();
      if(!tok || tok.provider !== "Gmail"){
        try{ await reauthGmail(mailClientId(mb.provider)); tok = mailTokenValid(); }
        catch(e){ return { converted: 0, reason: "reauth" }; }
      }
      if(!tok) return { converted: 0, reason: "reauth" };
      messages = await gmailFetchConfirmations(tok.access_token);
    } else if(mb.provider === "Outlook"){
      messages = await graphFetchConfirmations(await outlookToken());
    } else return { converted: 0, reason: "unsupported" };
  }catch(e){ return { converted: 0, reason: "fetch-failed" }; }
  const seen = new Set(Array.isArray(mb.confirmation_processed)? mb.confirmation_processed : []);
  const fresh = (messages || []).filter(m => m.id && !seen.has(m.id) && (Date.now() - new Date(m.received_at).getTime()) < 21*24*3600*1000);
  const parked = (STORE.filings.filings || []).filter(f => f.status === "parked");
  const matches = matchConfirmations(fresh, parked);
  matches.forEach(({ message, filing }) => {
    filing.status = "filed";
    filing.filed_at = message.received_at;
    filing.date = String(message.received_at).slice(0, 10);
    filing.reason = "Auto-filed — the confirmation email from " + (message.from || "the employer") + " was matched to this parked lead.";
    filing.check = { verdict: "email-confirmed", rules: [ { rule: "Filing proof", status: "pass", evidence: "Confirmation email received " + fmtDateTime(message.received_at) + ": \"" + message.subject + "\" (" + (message.from || "") + ")" } ] };
  });
  messages.forEach(m => { if(m.id) seen.add(m.id); });
  mb.confirmation_processed = Array.from(seen).slice(-400);
  mb.last_confirmation_scan_at = nowISO();
  try{ await storeSave("connections", "Confirmation match scan"); }catch(e){}
  if(matches.length){
    try{ await storeSave("filings", "Auto-file from confirmation emails"); }catch(e){}
    for(const { filing } of matches){
      try{ await logActivity("filing", "Auto-filed from a confirmation email: " + filing.company + " — " + filing.role + "."); }catch(e){}
    }
  }
  return { converted: matches.length };
}
async function fetchMailboxCodes(opts){

  } else if(mb.provider === "Outlook"){
    found = await graphFetchCodes(await outlookToken());
  } else return { added: 0, reason: "unsupported" };
  STORE.codes.codes = Array.isArray(STORE.codes.codes)? STORE.codes.codes : [];
  let added = 0;
  found.forEach(f => {
    const dupe = STORE.codes.codes.some(c => c.code === f.code && (c.service || "") === f.service
      && String(c.received_at || "").slice(0, 10) === String(f.received_at || "").slice(0, 10));
    if(!dupe){ STORE.codes.codes.unshift({ id: uid("code"), service: f.service, code: f.code, received_at: f.received_at, note: "Fetched automatically from " + mb.provider }); added++; }
  });
  STORE.codes.codes.sort((a, b) => String(b.received_at || "").localeCompare(String(a.received_at || "")));
  mb.last_checked_at = nowISO();
  if(added){
    await storeSave("codes", "Fetch mailbox codes");
    await storeSave("connections", "Mailbox code check");
    await logActivity("code", added + " new code" + (added === 1? "" : "s") + " fetched automatically from " + mb.provider + ".");
  }
  return { added: added };
}

/* ---------- code inbox ---------- */
function renderCodes(){
  const box = $("#codesBox"); if(!box) return;
  const codes = STORE.codes.codes || [];
  const mb = STORE.connections.mailbox || {};
  const tok = mailTokenLoad();
  const live = !!(mb.connected && tok && tok.provider === mb.provider && mailTokenValid());
  const stateLine = live
    ? "Connected to " + esc(mb.provider) + (mb.email? " as " + esc(mb.email) : "") + " — one-time sign-in codes and password-reset codes are fetched automatically, and application confirmation emails are matched to your parked leads and filed automatically." + (mb.last_checked_at? " Last checked " + esc(fmtDateTime(mb.last_checked_at)) + "." : "")
    : mb.connected
      ? "Your mailbox is set up, but its sign-in token is not live in this browser right now — reconnect to resume automatic fetching."
      : "Connect your mailbox and one-time codes land here automatically, and application confirmations get matched to your parked leads — fetched by the system, never pasted by you.";
  box.innerHTML = `
  <div class="card" style="margin:0">
    <p class="label">Code inbox</p>
    <p class="sub small">${stateLine}</p>
    ${codes.length? codes.map(c => '<div class="toggle"><div><b>'+esc(c.service||"Code")+'</b> <span class="mono">'+esc(c.code)+'</span><div class="sub small">'+esc(fmtDateTime(c.received_at))+(c.note? " · "+esc(c.note) : "")+'</div></div></div>').join("") : '<p class="sub">No codes yet.</p>'}
    <div class="mt">
      ${live? '<button class="btn ghost small" id="btnCheckMail">Check mailbox now</button> ' : '<button class="btn ghost small" id="btnGoConnectMail">'+(mb.connected? "Reconnect mailbox" : "Connect mailbox")+'</button> '}
      ${mb.connected? '<button class="btn ghost small" id="btnDiscMail">Disconnect mailbox</button> <button class="btn ghost small" id="btnToggleConfMatch">' + (mb.confirmation_matching === false? "Resume auto-filing from confirmation emails" : "Pause auto-filing from confirmation emails") + '</button>' : ""}
    </div>
    <details class="mt"><summary class="sub small" style="cursor:pointer">Got a code by text message instead? Add it manually</summary>
      <div class="grid2 mt">
        <div><label class="f">Service / site</label><input type="text" id="cdService" placeholder="e.g. a job board"></div>
        <div><label class="f">Code</label><input type="text" id="cdCode" placeholder="The code from the text"></div>
      </div>
      <div class="mt"><button class="btn ghost small" id="btnAddCode">Add to inbox</button></div>
    </details>
  </div>`;
  const chk = $("#btnCheckMail");
  if(chk) chk.addEventListener("click", async ev => {
    const btn = ev.currentTarget; setBusy(btn, true, "Checking…");
    try{
      const r = await fetchMailboxCodes({});
      if(r && r.reason === "reauth"){ toast("Mailbox sign-in expired — use Reconnect mailbox."); renderCodes(); }
      else { toast(r && r.added? r.added + " new code" + (r.added===1?"":"s") + " fetched." : "Mailbox checked — no new codes."); renderCodes(); }
    }catch(e){ banner("Checking the mailbox failed: "+esc(e.message||String(e)), "err"); }
    setBusy(btn, false);
  });
  const go = $("#btnGoConnectMail");
  if(go) go.addEventListener("click", () => renderWizard(6));
  const disc = $("#btnDiscMail");
  if(disc) disc.addEventListener("click", async () => {
    mailTokenClear();
    STORE.connections.mailbox.connected = false;
    try{ await storeSave("connections", "Disconnect mailbox"); }catch(e){}
    toast("Mailbox disconnected in this browser. Codes already fetched stay in your inbox.");
    renderCodes();
  });
  const tg = $("#btnToggleConfMatch");
  if(tg) tg.addEventListener("click", async () => {
    STORE.connections.mailbox.confirmation_matching = STORE.connections.mailbox.confirmation_matching === false? true : false;
    try{ await storeSave("connections", "Toggle confirmation matching"); }catch(e){}
    toast(STORE.connections.mailbox.confirmation_matching? "Automatic filing confirmations are ON — confirmation emails will be matched to your parked leads." : "Automatic filing confirmations paused — parked leads wait for Mark as filed.");
    renderCodes();
  });
  const addBtn = $("#btnAddCode");
  if(addBtn) addBtn.addEventListener("click", async () => {
    const service = $("#cdService").value.trim(), code = $("#cdCode").value.trim();
    if(!code){ toast("Type the code from the text message first."); return; }
    STORE.codes.codes = Array.isArray(STORE.codes.codes)? STORE.codes.codes: [];
    STORE.codes.codes.unshift({ id: uid("code"), service, code, received_at: nowISO(), note:"Added manually (text message)" });
    try{ await storeSave("codes", "Add code to inbox"); await logActivity("code", "A code for "+(service||"an unnamed service")+" was added to the code inbox manually."); renderCodes(); }
    catch(e){ banner("Saving the code failed: "+esc(e.message||String(e)), "err"); }
  });
}

/* ---------- activity ---------- */
function renderActivity(){
  const box = $("#activityBox"); if(!box) return;
  const entries = (STORE.activity.entries||[]).slice(0, 14);
  box.innerHTML = `
  <div class="card" style="margin:0">
    <p class="label">Activity — what the system did for itself</p>
    ${entries.length? entries.map(e => '<div class="toggle"><div><span class="pill '+(e.kind==="workaround"? "amber" : e.kind==="run"? "violet" : e.kind==="filing"? "green":"grey")+'">'+esc(e.kind)+'</span> <span class="small">'+esc(e.message)+'</span><div class="sub small">'+esc(fmtDateTime(e.at))+'</div></div></div>').join("") : '<p class="sub">Nothing yet. Saves, generations, retries and relaunches will be recorded here — in activity.json in your repo.</p>'}
  </div>`;
}

/* ---------- settings ---------- */
function renderSettings(){
  const box = $("#settingsBox"); if(!box) return;
  const p = STORE.profile || {}, cn = STORE.connections || {}, cov = STORE.coverage || {};
  const li = cn.linkedin || {}, mb = cn.mailbox || {};
  const saved = cov.saved || { titles:[], lanes:[] };
  const row = (label, value, pill, btn) => `
    <div class="toggle"><div><b>${label}</b><div class="sub small">${value}</div></div>
    <div>${pill || ""} ${btn || ""}</div></div>`;
  box.innerHTML = `
  <div class="card" id="settings">
    <p class="label">Settings</p>
    ${row("Data repo", '<span class="mono">'+esc(GH.owner)+"/"+esc(GH.repo)+'</span> — private repo holding everything this app knows about you',
      '<span class="pill green">connected</span>', "")}
    ${row("Signed in as", esc(p.name || "—") + (p.email? " · " + esc(p.email) : ""), "", '<button class="btn ghost small" id="btnSetProfile">Edit</button>')}
    ${row("LinkedIn", li.connected? "Connected" + (li.profile_url? " · " + esc(li.profile_url) : "") : "Not connected — applications work better with it",
      '<span class="pill '+(li.connected? "green":"grey")+'">'+(li.connected? "connected":"not connected")+'</span>', '<button class="btn ghost small" id="btnSetLinkedIn">Manage</button>')}
    ${row("Mailbox for codes", mb.connected? esc(mb.provider || "") + (mb.email? " · " + esc(mb.email) : "") + " — codes fetch automatically" : "Not connected — connect Gmail or Outlook and codes fetch themselves",
      '<span class="pill '+(mb.connected? "green":"grey")+'">'+(mb.connected? "connected":"not connected")+'</span>', '<button class="btn ghost small" id="btnSetMailbox">Manage</button>')}
    ${row("Saved coverage", (saved.titles||[]).length + " titles · " + (saved.lanes||[]).length + " lanes" + (cov.coverage_saved_at? " · saved " + esc(fmtDate(cov.coverage_saved_at)) : ""),
      "", '<button class="btn ghost small" id="btnSetCoverage">Manage</button>')}
    ${row("Hunt engine", ENGINE_STATE === false? "Not installed — Start cannot search until the engine lives in your repo" : ENGINE_STATE === true? "Installed in your repo — Start dispatches it and it writes real progress back" : "Not checked yet this session",
      '<span class="pill '+(ENGINE_STATE === true? "green" : ENGINE_STATE === false? "red":"grey")+'">'+(ENGINE_STATE === true? "installed" : ENGINE_STATE === false? "not installed" : "unknown")+'</span>', '<button class="btn ghost small" id="btnSetEngine">Manage</button>')}
    <div class="mt">
      <button class="btn ghost small" id="btnReVerify">Re-verify my details</button>
      <button class="btn ghost small" id="btnRedoWizard">Back to setup wizard</button>
      <button class="btn danger small" id="btnDisconnect">Sign out</button>
      <button class="btn ghost small" id="btnForget">Forget this account on this browser</button>
    </div>
    <p class="sub small mt">Your data is stored as nine small files under <span class="mono">data/</span> in that repo (profile, coverage, rules, answers, connections, runs, filings, codes, activity) — and nowhere else. Signing out locks the app on this browser — your account, GitHub connection and data stay saved here, and signing back in restores everything. Forget removes the saved account and sign-in tokens from this browser only; your repo is never touched.</p>
  </div>`;
  $("#btnDisconnect").addEventListener("click", signOut);
  const bf = $("#btnForget"); if(bf) bf.addEventListener("click", forgetDevice);
  $("#btnReVerify").addEventListener("click", renderVerify);
  $("#btnRedoWizard").addEventListener("click", () => renderWizard(1));
  const sp = $("#btnSetProfile"); if(sp) sp.addEventListener("click", () => renderWizard(1));
  const sl = $("#btnSetLinkedIn"); if(sl) sl.addEventListener("click", () => renderWizard(5));
  const sm = $("#btnSetMailbox"); if(sm) sm.addEventListener("click", () => renderWizard(6));
  const sc = $("#btnSetCoverage"); if(sc) sc.addEventListener("click", () => renderWizard(4));
  const se = $("#btnSetEngine"); if(se) se.addEventListener("click", () => { renderDashboard(); setTimeout(() => { const c = $("#tkControls"); if(c && c.scrollIntoView) c.scrollIntoView({ behavior:"smooth" }); }, 60); });
}

/* ---------- go ---------- */
let BOOTED = false;
function bootOnce(){ if(BOOTED) return; BOOTED = true; boot(); }
document.addEventListener("DOMContentLoaded", bootOnce);
if(document.readyState !== "loading") bootOnce();
</script>
</body>
