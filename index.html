<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Me A JOB</title>
<style>
  :root{
    --bg:#F6F2E7;
    --card:rgba(255,255,255,.86);
    --card-solid:#FFFFFF;
    --ink:#23202b;
    --muted:#8a8378;
    --muted2:#a89f8f;
    --line:rgba(120,105,75,.14);
    --accent:#6C5CE7;
    --accent2:#4a3fd6;
    --accent-soft:rgba(108,92,231,.10);
    --green:#1f9d66;
    --green-soft:rgba(31,157,102,.12);
    --amber:#c07f13;
    --amber-soft:rgba(217,152,32,.14);
    --red:#c0392b;
    --red-soft:rgba(192,57,43,.10);
    --radius:20px;
    --shadow:0 10px 30px rgba(90,75,40,.08), 0 2px 6px rgba(90,75,40,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--accent2)}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  header.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
  .brand-left{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:19px;
    box-shadow:0 6px 16px rgba(108,92,231,.35);
  }
  h1.brandname{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
  .tagline{color:var(--muted);font-size:13px;margin:2px 0 0}
  .card{
    background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px;margin:0 0 16px;
  }
  .label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .big{font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.05}
  .sub{color:var(--muted);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1 1 0;min-width:140px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media (max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
  label.f:first-child{margin-top:0}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=url],input[type=password],select,textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;
    font-size:15px;color:var(--ink);outline:none;font-family:inherit;
  }
  textarea{min-height:96px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{
    appearance:none;border:0;cursor:pointer;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:700;
    background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(108,92,231,.28);transition:transform .05s ease, background .15s;
  }
  .btn:hover{background:var(--accent2)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--accent2);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.small{padding:7px 14px;font-size:13px}
  .btn.danger{background:var(--red)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.green{background:var(--green-soft);color:var(--green)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .pill.red{background:var(--red-soft);color:var(--red)}
  .pill.violet{background:var(--accent-soft);color:var(--accent2)}
  .pill.grey{background:rgba(0,0,0,.06);color:var(--muted)}
  .chip{
    display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 8px 6px 13px;font-size:13px;font-weight:600;margin:0 7px 7px 0;
  }
  .chip button{border:0;background:var(--red-soft);color:var(--red);width:19px;height:19px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0}
  .notice{border-radius:14px;padding:13px 15px;font-size:14px;margin:12px 0}
  .notice.info{background:var(--accent-soft);color:#3730a3}
  .notice.warn{background:var(--amber-soft);color:#7c5410}
  .notice.err{background:var(--red-soft);color:var(--red)}
  .notice.ok{background:var(--green-soft);color:#146c43}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .stepdot{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
  .stepdot.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stepdot.done{background:var(--green-soft);color:var(--green);border-color:transparent}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{ text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:rgba(108,92,231,.04)}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .toggle:last-child{border-bottom:0}
  .switch{position:relative;width:46px;height:26px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#ddd5c2;border-radius:999px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(20px)}
  .lane-card{cursor:pointer;transition:transform .06s ease}
  .lane-card:hover{transform:translateY(-2px)}
  .bar{height:9px;border-radius:999px;background:rgba(120,105,75,.14);overflow:hidden;margin-top:9px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
  ol.pool{margin:6px 0 0;padding-left:22px;font-size:14px;line-height:1.65}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .mt{margin-top:14px}.mb{margin-bottom:12px}
  .flexbetween{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .hidden{display:none !important}
  .checklist{list-style:none;margin:8px 0;padding:0}
  .checklist li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;gap:9px;align-items:flex-start}
  .checklist li:last-child{border-bottom:0}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .filelist{font-size:13.5px;line-height:1.9}
  .kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px}
  details.filing{border-bottom:1px solid var(--line);padding:9px 0}
  details.filing summary{cursor:pointer;font-weight:600;font-size:14.5px}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23202b;color:#fff;
    padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:99;max-width:92vw;
  }

.livepill{display:inline-flex;align-items:center}
.dsec{margin-top:44px}
.liveprog{height:3px;width:38%;background:var(--accent);animation:liveprogmove 1.7s ease-in-out infinite alternate}
@keyframes liveprogmove{from{transform:translateX(-60%)}to{transform:translateX(230%)}}

.livedot{width:8px;height:8px;border-radius:50%;background:#6c4bd8;display:inline-block;margin-right:6px;animation:livepulse 1.6s infinite}
@keyframes livepulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.srcrow{display:grid;grid-template-columns:170px 1fr 92px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #eae4d6;cursor:pointer}
.srcrow:last-child{border-bottom:none}
.srcname{font-weight:600}
.srccount{text-align:right;color:#8a8378;font-size:13px}
details.fold summary{cursor:pointer;color:#6c4bd8;font-weight:600;margin:10px 0 4px}
.dashh{margin:0;font-size:26px}

/* ===== Sweep Tracker port — tokens + components replicated from the tracker ===== */
:root{
  --bg:#f6f2e7; --surface:#fff; --frost:#ffffffc7; --text:#2e2a22; --ink-2:#655e50; --dim:#a79b83;
  --border:#eae1cc; --accent:#5a5ce6; --accent-2:#8a7cf5; --accent-soft:#eceaff; --accent-ink:#4c46c8;
  --blue-soft:#e6edff; --blue-ink:#3355c9; --peri-soft:#e2e6ff; --peri-ink:#4453b8;
  --green-soft:#e5f6ec; --green-ink:#1d7a4c; --green:#2fbf71; --amber:#e8a33d; --amber-soft:#fdf2dc; --amber-ink:#96650a;
  --wash:#967a4212; --bar-track:#eae1cb; --red:#d64545; --red-soft:#fdecec; --red-ink:#a63a3a;
  --frost-green:#d5f3e1cc; --frost-red:#fde2e2d1; --frost-amber:#fdf2dcdb; --pill-bg:#ffffffb8;
  --radius:20px;
  --shadow:0 12px 32px #58462217,0 2px 6px #5846220d;
  --shadow-sm:0 6px 18px #58462214,0 1px 3px #5846220d;
  --shadow-float:0 26px 48px -14px #58462233,0 12px 22px -8px #5846221f,0 2px 5px #5846220f,inset 0 1px 0 #ffffffb3;
}
[data-theme="dark"]{
  --bg:#101218; --surface:#1a1d26; --frost:#1c1f2ac7; --text:#eef0f6; --ink-2:#aab0c0; --dim:#7c8496;
  --border:#262a38; --accent:#8b8ef7; --accent-2:#a894fa; --accent-soft:#262a4d; --accent-ink:#b9bcff;
  --blue-soft:#232c4d; --blue-ink:#a9b8ff; --peri-soft:#262b4d; --peri-ink:#b3bcff;
  --green-soft:#16301f; --green-ink:#7fd6a4; --green:#3ecf7f; --amber:#e8a33d; --amber-soft:#33270f; --amber-ink:#f0bb63;
  --wash:#8b8ef71a; --bar-track:#262a36; --red:#ff7a72; --red-soft:#3a1f22; --red-ink:#ffaaa3;
  --frost-green:#16301fd1; --frost-red:#3a1a1ad1; --frost-amber:#382a10db; --pill-bg:#06080e6b;
  --shadow:0 12px 32px #00000059,0 2px 6px #00000040;
  --shadow-sm:0 6px 18px #0000004d,0 1px 3px #0003;
  --shadow-float:0 26px 48px -14px #0009,0 12px 22px -8px #00000073,0 2px 5px #00000059,inset 0 1px 0 #ffffff24,0 0 10px #ffffff12,0 0 22px #ffffff0a;
}
.tk-frosted{background:var(--frost);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.tk-frosted-green{background:var(--frost-green);-webkit-backdrop-filter:blur(14px) saturate(1.45);backdrop-filter:blur(14px) saturate(1.45)}
.tk-frosted-red{background:var(--frost-red);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.tk-frosted-amber{background:var(--frost-amber);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.tk-float{box-shadow:var(--shadow-float)}
@keyframes tkBlinkSoft{0%,to{opacity:1}50%{opacity:.35}}
@keyframes tkPulseDot{0%,to{box-shadow:0 0 #5a5ce659}50%{box-shadow:0 0 0 6px #5a5ce600}}
@keyframes tkBarSlide{0%{transform:translate(-110%)}to{transform:translate(280%)}}
@keyframes tkBarShimmer{0%{background-position:200% 0}to{background-position:-200% 0}}
@keyframes tkFunnelDrop{0%{transform:translateY(-10px) scale(1);opacity:0}16%{opacity:1}72%{opacity:1}to{transform:translate(var(--funnel-x,0px),44px) scale(.42);opacity:0}}
@keyframes tkFunnelGlow{0%,to{opacity:.55}50%{opacity:1}}
@keyframes tkTitleSwitch{0%{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes tkSpin{to{transform:rotate(360deg)}}
.tk-livedot{animation:1.6s ease-in-out infinite tkBlinkSoft}
.tk-nowdot{animation:2s ease-in-out infinite tkPulseDot}
.tk-barlive{animation:1.4s linear infinite tkBarShimmer;background-image:linear-gradient(100deg,#0000 30%,#ffffff80 50%,#0000 70%);background-size:200% 100%}
.tk-browserbar{animation:1.6s ease-in-out infinite tkBarSlide}
.tk-funnelapp{animation:2.3s ease-in infinite tkFunnelDrop;will-change:transform,opacity}
.tk-funnelglow{animation:2.3s ease-in-out infinite tkFunnelGlow}
.tk-incoming{animation:.45s ease-out tkTitleSwitch}
.tk-spin{animation:1s linear infinite tkSpin}
@media (prefers-reduced-motion:reduce){.tk-livedot,.tk-nowdot,.tk-barlive,.tk-browserbar,.tk-funnelapp,.tk-funnelglow,.tk-incoming{animation:none!important}.tk-funnelapp{opacity:.85}}

.tk-wrap{max-width:880px;margin:0 auto;padding:44px 24px 64px;font-size:17px;color:var(--text)}
@media (max-width:640px){.tk-wrap{padding:32px 18px 64px}}
.tk-h2{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin:0 0 16px}
.tk-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.tk-section{margin-top:48px}
.tk-sub{font-size:14.5px;line-height:1.55;color:var(--dim)}
.tk-h1{font-size:clamp(34px,6vw,48px);font-weight:300;line-height:1.12;letter-spacing:-.02em;margin:0}
.tk-bigbtn{display:inline-block;cursor:pointer;border-radius:999px;border:0;padding:14px 28px;font-size:17px;font-weight:700;box-shadow:var(--shadow);font-family:inherit}
.tk-bigbtn:disabled{cursor:default;opacity:.6}
.tk-bigbtn.green{background:var(--green);color:#fff}
.tk-bigbtn.red{background:var(--red);color:#fff}
.tk-bigbtn.outline-green{background:var(--green-soft);color:var(--green-ink);border:2px solid var(--green);cursor:default}
.tk-bigbtn.outline-red{background:var(--surface);color:var(--red);border:2px solid var(--red);cursor:default}
.tk-caption{font-size:14px;color:var(--dim);margin:0}
.tk-statusline{font-size:14px;color:var(--dim);margin:0}
.tk-statusline.err{color:var(--red)}
.tk-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:15.5px}
.tk-table th{border-bottom:1px solid var(--border);padding:10px 12px 8px 0;text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.tk-table th:last-child{padding-right:0}
.tk-table th.r,.tk-table td.r{text-align:right}
.tk-table td{border-bottom:1px solid var(--border);padding:11px 12px 11px 0;vertical-align:top;word-break:break-word}
.tk-table td:last-child{padding-right:0}
.tk-table td.co{font-weight:700}
.tk-table td.dim2{color:var(--ink-2)}
.tk-table td.time{white-space:nowrap;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tk-where{display:inline-block;max-width:100%;white-space:normal;word-break:break-word;border-radius:999px;padding:2px 10px;font-size:13.5px;font-weight:600}
.tk-where.green{background:var(--green-soft);color:var(--green-ink)}
.tk-where.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tk-where.red{background:var(--red-soft);color:var(--red-ink)}
.tk-where.grey{background:var(--wash);color:var(--ink-2)}
.tk-rowbtn{cursor:pointer;border:0;border-radius:999px;padding:6px 16px;font-size:13.5px;font-weight:700;font-family:inherit;white-space:nowrap}
.tk-rowbtn:disabled{cursor:default;opacity:.6}
.tk-rowbtn.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tk-rowbtn.red{background:var(--red-soft);color:var(--red-ink)}
.tk-rowbtn.accent{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
.tk-rowbtn.accentsoft{background:var(--accent-soft);color:var(--accent-ink)}
.tk-rowbtn.track{background:var(--bar-track);color:var(--ink-2)}
.tk-countpill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.tk-countpill.green{background:var(--green-soft);color:var(--green-ink)}
.tk-countpill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tk-countpill.red{background:var(--red-soft);color:var(--red-ink)}
.tk-countpill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tk-countpill.track{background:var(--bar-track);color:var(--ink-2)}
.tk-panelhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.tk-panelhead h3{font-size:18.5px;font-weight:700;margin:0}
.tk-closebtn{margin-left:auto;cursor:pointer;border:0;border-radius:999px;background:var(--bar-track);padding:6px 16px;font-size:13.5px;font-weight:700;color:var(--ink-2);font-family:inherit}
.tk-grouplabel{display:inline-block;border-radius:999px;background:var(--green-soft);padding:2px 10px;font-size:13px;font-weight:700;color:var(--green-ink)}
.tk-checkbtn{display:inline-flex;max-width:100%;cursor:pointer;align-items:center;gap:6px;white-space:normal;border-radius:999px;text-align:left;border:0;padding:4px 12px;font-size:13px;font-weight:700;font-family:inherit}
.tk-checkbtn.green{background:var(--green-soft);color:var(--green-ink)}
.tk-checkbtn.red{background:var(--red-soft);color:var(--red-ink)}
.tk-checkbtn.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tk-rulepill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.tk-rulepill.green{background:var(--green-soft);color:var(--green-ink)}
.tk-rulepill.red{background:var(--red-soft);color:var(--red-ink)}
.tk-rulepill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tk-rulepill.grey{background:var(--bar-track);color:var(--ink-2)}
.tk-todaygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:640px){.tk-todaygrid{grid-template-columns:repeat(2,1fr)}}
.tk-todaycard{display:flex;width:100%;flex-direction:column;border:0;border-radius:var(--radius);padding:22px 20px 20px;text-align:center;font-family:inherit}
button.tk-todaycard{cursor:pointer}
.tk-todaycard .tk-tlabel{margin-top:10px;display:block;font-size:15.5px;font-weight:600}
.tk-todaycard .tk-tap{margin-top:4px;display:block;font-size:13px;font-weight:600}
.tk-cardpills{margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tk-cardpills.left{justify-content:flex-start}
.tk-srcpill{white-space:nowrap;border-radius:999px;background:var(--pill-bg);padding:3px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tk-gauge{position:relative;margin:0 auto;display:block;height:104px;width:104px;flex-shrink:0}
.tk-gauge .tk-gaugenum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.tk-donut{position:relative;display:block;height:104px;width:104px}
.tk-donut .tk-donutnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.tk-funnelbox{position:relative;margin:4px auto 0;height:96px;width:124px}
.tk-funnelchip{position:absolute;top:0;display:block;height:13px;width:19px;border-radius:4px;box-shadow:var(--shadow-sm)}
.tk-incomingpill{margin:10px auto 0;display:flex;height:44px;width:100%;max-width:220px;align-items:center;justify-content:center;overflow:hidden;border-radius:999px;background:var(--accent-soft);padding:0 12px}
.tk-incomingpill span{text-align:center;font-size:12.5px;font-weight:700;line-height:1.3;color:var(--accent-ink);word-break:break-word}
.tk-incomingpill span.dim{font-weight:600;color:var(--dim)}
.tk-tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:16px;grid-auto-rows:1fr;list-style:none;margin:0;padding:0}

.tk-tile{position:relative;display:flex;height:100%;width:100%;cursor:pointer;flex-direction:column;align-items:center;border:0;border-radius:28px;padding:20px;text-align:center;font-family:inherit;color:var(--text)}
.tk-tile.track{background:var(--bar-track)}
.tk-tile.selected{outline:2px solid var(--accent);outline-offset:2px;box-shadow:var(--shadow-sm)}
.tk-tile .tk-tilename{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;line-height:1.3}
.tk-prioritytag{border-radius:999px;background:var(--accent);padding:2px 8px;font-size:10.5px;font-weight:800;line-height:1.4;letter-spacing:.09em;color:#fff}
.tk-selectedtag{border-radius:999px;background:var(--green);padding:2px 8px;font-size:10.5px;font-weight:800;line-height:1.4;letter-spacing:.09em;color:#fff}
.tk-checkbadge{position:absolute;right:12px;top:12px;display:flex;height:24px;width:24px;align-items:center;justify-content:center;border-radius:999px;border:2px solid var(--dim);background:var(--surface);color:transparent}
.tk-checkbadge.on{border-color:var(--accent);background:var(--accent);color:#fff}
.tk-tilestatus{margin-top:12px;display:flex;align-items:center;gap:6px;font-size:15px}
.tk-dot8{display:inline-block;height:8px;width:8px;flex-shrink:0;border-radius:999px}
.tk-spinner{display:inline-block;height:12px;width:12px;flex-shrink:0;border-radius:999px;border:2px solid var(--amber-ink);border-top-color:transparent}
.tk-bar{margin-top:auto;display:block;width:100%;padding-top:16px}
.tk-bar .tk-bartrack{display:block;height:10px;overflow:hidden;border-radius:999px;background:var(--pill-bg)}
.tk-bar .tk-barfill{display:block;height:100%;border-radius:999px;transition:width 1s ease-out}
.tk-sitesline{margin-top:10px;display:block;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}
.tk-chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 5px 5px 13px;font-size:14px;line-height:1.4}
.tk-chip.active{background:var(--accent);font-weight:700;color:#fff;box-shadow:0 0 0 2px var(--accent-soft),0 0 16px rgba(90,92,230,.45)}
.tk-chip.searched{background:var(--green-soft);font-weight:600;color:var(--green-ink)}
.tk-chip.not{background:var(--bar-track);font-weight:500;color:var(--dim);opacity:.7}
.tk-chip.selectable{padding:3px 5px 3px 13px;background:var(--bar-track)}
.tk-chip.selectable.on{background:var(--accent);box-shadow:var(--shadow-sm)}
.tk-chip button.tk-chipmain{cursor:pointer;border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left}
.tk-chip .tk-addedtag{margin-left:6px;border-radius:999px;background:var(--accent-soft);padding:0 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-ink)}
.tk-chip.active .tk-addedtag{background:rgba(255,255,255,.25);color:#fff}
.tk-chiprm{margin-left:4px;display:inline-flex;height:18px;width:18px;flex-shrink:0;cursor:pointer;align-items:center;justify-content:center;border-radius:999px;border:0;background:var(--surface);font-size:11px;font-weight:700;line-height:1;color:var(--ink-2);opacity:.8;font-family:inherit}
.tk-stageicon{display:flex;width:22px;flex:none;justify-content:center;padding-top:2px}
.tk-stagecheck{display:flex;height:20px;width:20px;align-items:center;justify-content:center;border-radius:999px;background:var(--green)}
.tk-stagedot{display:block;height:10px;width:10px;border-radius:999px;margin-top:3px}
.tk-ringpending{display:block;height:18px;width:18px;border-radius:999px;border:2px solid var(--dim);opacity:.5;margin-top:2px}
.tk-stagepill{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tk-stagepill.green{background:var(--green-soft);color:var(--green-ink)}
.tk-stagepill.accent{background:var(--accent);color:#fff}
.tk-stagepill.red{background:var(--red-soft);color:var(--red-ink)}
.tk-stagepill.grey{background:var(--bar-track);color:var(--ink-2)}
.tk-stagedetail{margin-top:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:12px 14px}
.tk-detailhead{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.tk-siterow{display:flex;align-items:baseline;gap:10px;border-radius:12px;background:var(--wash);padding:8px 14px}
.tk-sitenum{flex-shrink:0;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim)}

.tk-statepill.green{background:var(--green-soft);color:var(--green-ink)}
.tk-statepill.red{background:var(--red-soft);color:var(--red-ink)}

.tk-statepill.grey{background:var(--bar-track);color:var(--ink-2)}

.tk-rulecheck.on{border-color:var(--accent);background:var(--accent);color:#fff;opacity:1}
.tk-pillinput{border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:8px 16px;font-size:14.5px;color:var(--text);font-family:inherit;min-width:0}

.tk-selbtn.accent{background:var(--accent);color:#fff}

.tk-foldchev.closed{transform:rotate(-90deg)}

[data-theme="dark"] body{background:#101218;color:#eef0f6}
[data-theme="dark"] .card{background:#1a1d26;color:#eef0f6}

      <div class="logo">G</div>
      <div>
        <h1 class="brandname">Get Me A JOB</h1>
        <p class="tagline">Your job hunt, run from your own GitHub repo.</p>
      </div>

    <div id="headActions"></div>

  <main id="view"><div class="card"><p class="sub">Loading…</p></div></main>

    Get Me A JOB runs entirely in your browser. Your data lives only in your own GitHub repository —
    this page talks to <span class="mono">api.github.com</span> and nowhere else.
  </p>

<div id="toast" class="toast hidden"></div>

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64||"").replace(/\s/g,""));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? "—" : d.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? String(iso).slice(0,10) : d.toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"}); }

function ghSave(){ try{ localStorage.setItem(GH_KEY, JSON.stringify(GH)); }catch(e){} }
function ghClear(){ try{ localStorage.removeItem(GH_KEY); }catch(e){} GH = null; }

const ACCOUNT_KEY = "getMeAJobAccount";  // localStorage: {name, email, owner, repo, signed_out, created_at}
function accountLoad(){ try{ const raw = localStorage.getItem(ACCOUNT_KEY); return raw? JSON.parse(raw): null; }catch(e){ return null; } }
function accountSave(a){ try{ localStorage.setItem(ACCOUNT_KEY, JSON.stringify(a)); }catch(e){} }

let ENGINE_STATE = null;   /* null = unknown, true = installed, false = not installed */
async function checkEngineInstalled(){
  try{
    const wf = await ghReadFile(".github/workflows/hunt.yml");
    if(!wf.exists){ ENGINE_STATE = false; return false; }
    const en = await ghReadFile("engine/hunt.mjs");
    ENGINE_STATE = !!en.exists;
  }catch(e){ ENGINE_STATE = null; }
  return ENGINE_STATE;
}
async function ghPutText(path, text, message){
  let attempt = 0, lastErr = null;
  while(attempt < 3){
    attempt++;
    let sha = null;
    try{ const cur = await ghReadFile(path); sha = cur.exists? cur.sha : null; }catch(e){}
    const body = { message: message || ("Write "+path), content: b64encode(text) };
    if(sha) body.sha = sha;
    const res = await ghFetch(repoPath(path), { method:"PUT", body: JSON.stringify(body) });
    if(res.status === 200 || res.status === 201){
      const back = await ghReadFile(path);
      if(back.exists && back.raw === text) return true;
      lastErr = new Error("Write to "+path+" could not be verified on read-back.");
      continue;
    }
    if(res.status === 403) throw new Error("GitHub refused the write to "+path+" (403). Workflow files need the token's Workflows permission — add Contents, Actions and Workflows (read & write) to the token in GitHub, then try again.");
    if(res.status === 409 || res.status === 422){ lastErr = new Error("Conflict writing "+path+" ("+res.status+")."); await sleep(500); continue; }
    const t = await res.text().catch(()=> "");
    throw new Error("GitHub write failed ("+res.status+") for "+path+". "+t.slice(0,120));
  }
  throw lastErr || new Error("Could not write "+path);
}
async function installEngine(){
  const btn = $("#btnInstallEngine"); setBusy(btn, true, "Installing…");
  try{
    await ghPutText(".github/workflows/hunt.yml", b64decode(ENGINE_FILES_B64.workflow), "Install hunt engine workflow");
    await ghPutText("engine/hunt.mjs", b64decode(ENGINE_FILES_B64.engine), "Install hunt engine");
    ENGINE_STATE = true;
    await logActivity("setup", "Hunt engine installed into the repo (.github/workflows/hunt.yml + engine/hunt.mjs).");
    toast("Hunt engine installed — Start now launches real searches in your repo.");
    renderDashboard();
  }catch(e){
    banner("Engine install hit a problem: "+esc(e.message||String(e)), "err");
    setBusy(btn, false);
  }
}

async function ghFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  }, opts.headers||{});
  if(GH && GH.token) headers["Authorization"] = "Bearer " + GH.token;
  if(opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  const res = await fetch(API + path, Object.assign({}, opts, {headers}));
  return res;
}
const repoPath = p => "/repos/" + encodeURIComponent(GH.owner) + "/" + encodeURIComponent(GH.repo) + "/contents/" + p.split("/").map(encodeURIComponent).join("/");

/* Read one file from the repo. Returns {exists, data, sha, raw}. Throws on auth/network errors. */
async function ghReadFile(path){
  const res = await ghFetch(repoPath(path));
  if(res.status === 404) return {exists:false, data:null, sha:null};
  if(res.status === 401 || res.status === 403){
    const t = await res.text().catch(()=> "");
    throw new Error("GitHub rejected the token ("+res.status+"). Check that the token has Contents read & write on this repo. " + (t.slice(0,140)));
  }
  if(!res.ok) throw new Error("GitHub read failed ("+res.status+") for "+path);
  const j = await res.json();
  const text = b64decode(j.content||"");
  let data = null;
  try{ data = JSON.parse(text); }catch(e){ data = null; }
  return {exists:true, data, sha:j.sha, raw:text};
}

/* Write one file with sha-aware conflict handling + read-back verification.
   On 409/422: re-read, let mergeFn(latestData) produce the merged object, retry (up to 3). */
async function ghWriteFile(path, data, message, mergeFn){
  let attempt = 0, current = data, lastErr = null;
  while(attempt < 4){
    attempt++;
    let sha = null;
    try{
      const cur = await ghReadFile(path);
      sha = cur.exists? cur.sha: null;
      if(attempt > 1 && mergeFn && cur.exists && cur.data) current = mergeFn(cur.data, current);
    }catch(e){ /* read failure is handled by the PUT path below / surfaced on retry */ }
    const body = { message: message || ("Update "+path), content: b64encode(JSON.stringify(current, null, 2)) };
    if(sha) body.sha = sha;
    let res;
    try{ res = await ghFetch(repoPath(path), {method:"PUT", body: JSON.stringify(body)}); }
    catch(e){ lastErr = e; await sleep(600); continue; }
    if(res.status === 200 || res.status === 201){
      /* read-back verification */
      try{
        const back = await ghReadFile(path);
        if(back.exists && JSON.stringify(back.data) === JSON.stringify(current)) return {ok:true, attempts:attempt};
        lastErr = new Error("Read-back did not match what was written for "+path);
      }catch(e){ lastErr = e; }
      await sleep(500); continue;
    }
    if(res.status === 409 || res.status === 422){
      lastErr = new Error("Write conflict on "+path+" ("+res.status+")");
      await logActivity("workaround", "Write conflict on "+path+" — re-read the latest copy, merged, and retried (attempt "+attempt+").");
      await sleep(500); continue;
    }
    if(res.status === 401 || res.status === 403){
      const t = await res.text().catch(()=> "");
      throw new Error("GitHub rejected the write ("+res.status+"). The token needs Contents: Read and write on this repo. "+t.slice(0,140));
    }
    const t = await res.text().catch(()=> "");
    lastErr = new Error("GitHub write failed ("+res.status+") for "+path+": "+t.slice(0,160));
    await sleep(600);
  }
  throw lastErr || new Error("Could not write "+path+" after several attempts.");
}
const sleep = ms => new Promise(r=>setTimeout(r, ms));

/* In-memory mirror of the repo files + their shas are re-read per write (ghWriteFile handles shas). */
let STORE = null;   // {profile:{...}, coverage:{...}, ...}
let STORE_LOADED_AT = "";

async function storeInit(){
  /* Create any missing data files (empty defaults). Records what it did in activity. */
  const created = [];
  for(const key of Object.keys(FILES)){
    const r = await ghReadFile(FILES[key]);
    if(!r.exists){
      await ghWriteFile(FILES[key], defaultsFor(key), "Initialize "+FILES[key]);
      created.push(FILES[key]);
    } else if(r.data == null){
      /* file exists but is not valid JSON — recreate it empty rather than dead-end */
      await ghWriteFile(FILES[key], defaultsFor(key), "Repair "+FILES[key]+" (was not valid JSON)");
      created.push(FILES[key]+" (repaired)");
    }
  }
  return created;
}
async function storeLoad(){
  STORE = {};
  for(const key of Object.keys(FILES)){
    const r = await ghReadFile(FILES[key]);
    STORE[key] = r.exists && r.data? Object.assign(defaultsFor(key), r.data) : defaultsFor(key);
  }
  STORE_LOADED_AT = nowISO();
  return STORE;
}
/* Save one store section back to the repo (merge-on-conflict keeps the newest of each top-level key). */
async function storeSave(key, message){
  STORE[key].updated_at = nowISO();
  const snapshot = clone(STORE[key]);
  const res = await ghWriteFile(FILES[key], snapshot, message || ("Update "+FILES[key]), (latest, mine) => {
    return Object.assign({}, latest, mine);
  });
  return res;
}
/* Activity log lives in the repo too; logging must never break the app, so failures are swallowed. */
async function logActivity(kind, message){
  try{
    if(!STORE) return;
    STORE.activity.entries = Array.isArray(STORE.activity.entries)? STORE.activity.entries: [];
    STORE.activity.entries.unshift({ id: uid("act"), at: nowISO(), kind: kind||"info", message: String(message||"") });
    STORE.activity.entries = STORE.activity.entries.slice(0, 400);
    await storeSave("activity", "Log activity");
  }catch(e){ /* never surface logging failures as app failures */ }
}
async function noteWorkaround(message){ await logActivity("workaround", message); }

  "nurse","therapist","pharmacist","teacher","officer","supervisor","representative","accountant","auditor","counselor"];

const SECTION_HEADERS = {
  "summary":"summary","profile":"summary","objective":"summary","professional summary":"summary",
  "experience":"experience","work experience":"experience","professional experience":"experience",
  "employment":"experience","employment history":"experience","work history":"experience",
  "skills":"skills","technical skills":"skills","core competencies":"skills","key skills":"skills","qualifications":"skills",
  "education":"education","licenses":"education","licenses and education":"education",
  "certifications":"education","education and certifications":"education"
};
function sectionOfLine(ln){
  const t = ln.trim().replace(/:$/,"");
  if(!t || t.length > 42) return null;
  if(/^[A-Z][A-Z &\/\-]+$/.test(t)) return SECTION_HEADERS[t.toLowerCase()] || "other";
  return SECTION_HEADERS[t.toLowerCase()] || null;
}
function detectFromResume(text){
  const clean = String(text||"");
  const low = clean.toLowerCase();
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const hasWord = (hay, s) => new RegExp("(^|[^a-z0-9])"+escRe(String(s).toLowerCase())+"([^a-z0-9]|$)", "i").test(hay);
  /* split into sections so education/licenses never masquerade as experience */
  const secs = { preamble:[], summary:[], experience:[], skills:[], education:[], other:[] };
  let cur = "preamble";
  lines(clean).forEach(ln => {
    const h = sectionOfLine(ln);
    if(h){ cur = h; return; }
    secs[cur].push(ln);
  });
  const secText = k => secs[k].join("\n");
  const expText = secText("experience");
  const skillsText = secText("skills");
  const summaryText = secText("summary");
  const empSource = expText.trim()? expText : [secText("preamble"), summaryText, secText("other")].join("\n");
  /* employers + held titles from "Title — Company, City, ST" header lines */
  const employers = [];
  const pushEmp = name => {
    const n = String(name||"").trim().replace(/[,.;]+$/,"").trim();
    if(n.length >= 2 && n.length <= 50 && /[a-z]/i.test(n) && !/^(present|current|various|multiple)$/i.test(n)
       && !employers.some(e => e.toLowerCase() === n.toLowerCase())) employers.push(n);
  };
  const heldTitles = [];
  const pushTitle = t => {
    const c = String(t||"").split(",")[0].replace(/[•·].*$/,"").replace(/\s{2,}/g," ").trim();
    if(c.length >= 3 && c.length <= 60 && !heldTitles.some(x => x.toLowerCase() === c.toLowerCase())) heldTitles.push(c);
  };
  empSource.split("\n").forEach(ln => {
    const parts = ln.split(/\s+[—–]\s+|\s+\|\s+/);
    if(parts.length >= 2){
      const cand = parts[parts.length-1].trim()
        .replace(/,\s*[^,]+,\s*[A-Z]{2}(\s+\d{5})?\s*$/,"")
        .replace(/,\s*(19|20)\d{2}\s*$/,"").trim();
      if(!/(19|20)\d{2}/.test(cand) && !/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(cand)) pushEmp(cand);
      if(TITLE_HINTS.some(h => parts[0].toLowerCase().includes(h))) pushTitle(parts[0]);
    }
  });
  let m;
  const atRe = /\bat\s+([A-Z][A-Za-z0-9&.'’\-]+(?:\s+[A-Z][A-Za-z0-9&.'’\-]+){0,3})/g;
  const empHay = empSource + "\n" + summaryText;
  while((m = atRe.exec(empHay)) !== null) pushEmp(m[1]);
  /* titles held: the title line under the name, plus a guarded hint scan (no bullets, no degree lines) */
  secs.preamble.slice(1).forEach(ln => { if(ln.trim().length < 60 && TITLE_HINTS.some(h => ln.toLowerCase().includes(h))) pushTitle(ln); });
  [expText, secText("preamble")].join("\n").split("\n").forEach(ln => {
    const l = ln.toLowerCase();
    if(ln.length > 4 && ln.length < 70 && ln.trim().split(/\s+/).length <= 6 && !/^\s*[-•*]/.test(ln)
       && !ln.includes("—") && !ln.includes("|") && TITLE_HINTS.some(h => l.includes(h))
       && !/^(b\.s\.|b\.a\.|m\.s\.|mba|ph\.d|bsn)/i.test(ln.trim())){
      pushTitle(ln);
    }
  });
  /* skills: strong vocabulary anywhere; ambiguous everyday words only inside the Skills section */
  const skills = SKILL_WORDS.filter(s => hasWord(low, s));
  if(skillsText) AMBIGUOUS_SKILLS.forEach(s => { if(hasWord(skillsText.toLowerCase(), s)) skills.push(s); });
  /* years of experience: month-name and bare-year ranges, earliest start to latest end */
  const MON = "(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
  const rangeRe = new RegExp(MON+"?\\.?\\s*(19|20)\\d{2}\\s*(?:-|–|—|to)\\s*(?:"+MON+"?\\.?\\s*(?:(19|20)\\d{2}|present|current|now))", "gi");
  let earliest = null, latest = null;
  while((m = rangeRe.exec(clean)) !== null){
    const ys = m[0].match(/(19|20)\d{2}/g);
    if(ys){ const a = parseInt(ys[0],10); if(earliest===null || a<earliest) earliest = a; }
    if(/present|current|now/i.test(m[0])) latest = new Date().getFullYear();
    else if(ys && ys.length>1){ const b = parseInt(ys[ys.length-1],10); if(latest===null || b>latest) latest = b; }
  }
  let yearsExp = "";
  if(earliest !== null && latest !== null && latest >= earliest) yearsExp = String(latest - earliest);
  /* industries: strong sources (name block, summary, skills, employers, titles) decide;
     experience-bullet mentions need at least two distinct keyword hits, so one incidental
     word ("hospitals" in an engineer's bullet) never spawns a sector lane */
  const strongText = [secText("preamble"), summaryText, skillsText, employers.join("\n"), heldTitles.join("\n")].join("\n").toLowerCase();
  const weakLow = expText.toLowerCase();
  const industries = Object.keys(INDUSTRY_WORDS).filter(ind => {
    const kws = INDUSTRY_WORDS[ind];
    if(kws.some(w => hasWord(strongText, w))) return true;
    return kws.filter(w => hasWord(weakLow, w)).length >= 2;
  });
  return {
    skills: uniq(skills).slice(0, 40),
    employers: employers.slice(0, 15),
    titles: heldTitles.slice(0, 12),
    industries: industries,
    years_experience: yearsExp,
    summary: ""
  };
}

/* Best-effort text from an uploaded file: .txt directly; .pdf/.docx naive string scan; paste fallback always offered. */
async function extractFileText(file){
  const name = (file.name||"").toLowerCase();
  if(name.endsWith(".txt") || file.type === "text/plain") return await file.text();
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  /* collect printable runs — works well enough for many PDFs/DOCXs to seed detection; user can paste instead */
  let out = "", run = "";
  for(let i=0;i<bytes.length;i++){
    const c = bytes[i];
    if(c >= 32 && c < 127 || c === 10 || c === 13){ run += String.fromCharCode(c); }
    else { if(run.length >= 4) out += run + "\n"; run = ""; }
  }
  if(run.length >= 4) out += run;
  return out.slice(0, 200000);
}

/* ---------- wide coverage generation ---------- */
const SENIORITY = ["", "Senior ", "Lead ", "Principal ", "Staff "];
const ROLE_FAMILIES = [
  { keys:["nurse","nursing"], family:["Nurse","Registered Nurse","ICU Nurse","ER Nurse","Charge Nurse","Clinical Nurse","Staff Nurse","Telemetry Nurse","Critical Care Nurse","Nurse Practitioner"] },
  { keys:["analyst"], family:["Analyst","Business Analyst","Systems Analyst","Data Analyst","Business Systems Analyst","Functional Analyst","Reporting Analyst"] },
  { keys:["marketing"], family:["Marketing Manager","Digital Marketing Manager","Brand Manager","Content Marketing Manager","Demand Generation Manager","Product Marketing Manager","Growth Marketing Manager","Campaign Manager","Marketing Specialist","Marketing Director"] },
  { keys:["architect"], family:["Architect","Solutions Architect","Enterprise Architect","Cloud Architect","Infrastructure Architect","Application Architect","Technical Architect"] },
  { keys:["engineer"], family:["Engineer","Mechanical Engineer","Design Engineer","Manufacturing Engineer","Project Engineer","Systems Engineer","Cloud Engineer","Infrastructure Engineer","Platform Engineer","Support Engineer","DevOps Engineer"] },
  { keys:["designer"], family:["Designer","Product Designer","UX Designer","UI Designer","Interaction Designer","Visual Designer"] },
  { keys:["manager"], family:["Manager","Program Manager","Project Manager","Product Manager","Operations Manager","Delivery Manager"] },
  { keys:["director"], family:["Director","Project Director","Program Director","Operations Director","Managing Director","Director of Operations","Associate Director","Executive Director","Senior Director"] },
  { keys:["developer"], family:["Developer","Software Developer","Application Developer","Full Stack Developer","Web Developer"] },
  { keys:["consultant"], family:["Consultant","Solutions Consultant","Technical Consultant","Implementation Consultant","Advisory Consultant"] },
  { keys:["administrator"], family:["Administrator","Systems Administrator","Cloud Administrator","Network Administrator","Database Administrator"] },
  { keys:["specialist"], family:["Specialist","Technical Specialist","Implementation Specialist","Support Specialist","Operations Specialist"] },
  { keys:["scientist"], family:["Scientist","Data Scientist","Research Scientist","Applied Scientist"] },
  { keys:["technician"], family:["Technician","Support Technician","Field Technician","Systems Technician"] },
  { keys:["coordinator"], family:["Coordinator","Program Coordinator","Project Coordinator","Operations Coordinator"] },
  { keys:["therapist"], family:["Therapist","Physical Therapist","Occupational Therapist","Respiratory Therapist","Speech Therapist"] }
];
function familyForTitle(title){
  const low = String(title||"").toLowerCase();
  for(const rf of ROLE_FAMILIES){ if(rf.keys.some(k => low.includes(k))) return rf.family; }
  return null;
}
/* career-field words: when the title itself names a field ("Healthcare Project Director",
   "Data Analyst"), the generated set carries field-flavored variants of the family forms,
   so the titles match the user's actual field instead of generic roles */
const FIELD_WORDS = ["healthcare","clinical","medical","data","cloud","digital","marketing","product",
  "software","security","cyber","financial","finance","operations","business","technical","information",
  "mechanical","electrical","civil","industrial","quality","customer","sales","energy","retail","legal",
  "content","brand","growth","platform","infrastructure","network","systems","enterprise","solutions",
  "application","research","human"];
function titleFieldWord(title){
  const words = String(title||"").toLowerCase().split(/[^a-z]+/).filter(Boolean)
    .filter(w => !["senior","lead","principal","staff","junior","sr","jr"].includes(w));
  if(words.length && FIELD_WORDS.includes(words[0])) return words[0][0].toUpperCase() + words[0].slice(1);
  return "";
}
function generateTitles(specifiedTitle, detection){
  const title = String(specifiedTitle||"").trim();
  const family = familyForTitle(title);
  const headWord = title.toLowerCase().split(/[^a-z]+/).filter(Boolean).pop() || "";
  let out = [];
  if(title) out.push(title);
  const fieldWord = titleFieldWord(title);
  if(family && fieldWord){
    /* field-flavored variants first, so they survive the cap: "Healthcare Program Director", "Data Systems Analyst" */
    family.forEach(f => {
      if(!f.toLowerCase().includes(fieldWord.toLowerCase())) out.push(fieldWord + " " + f);
    });
  }
  if(family){
    family.forEach(f => {
      /* a bare head noun ("Analyst") IS the specified title once its domain word is on it —
         composing domain + family blindly produced "Data Analyst Analyst" */
      const composed = (f.split(" ").length === 1 && f.toLowerCase() === headWord) ? title : f;
      SENIORITY.forEach(p => out.push(p + composed));
    });
  }
  /* fold in the titles the resume actually held */
  (detection.titles||[]).forEach(t => out.push(t));
  if(!family){
    /* no known family: seniority variants of the title itself, plus the families of titles actually held */
    SENIORITY.forEach(p => { if(p && title) out.push(p + title); });
    (detection.titles||[]).forEach(t => {
      const hf = familyForTitle(t);
      if(hf) hf.forEach(f => SENIORITY.forEach(p => out.push(p + f)));
    });
  }
  const tidy = arr => uniq(arr.map(t => t.replace(/\b(\w+)(\s+\1\b)+/gi, "$1")))
    .filter(t => t.length >= 3 && t.length <= 60);
  out = tidy(out);
  if(out.length < 20 && family){
    /* widen: bare family forms at every seniority level */
    family.forEach(f => SENIORITY.forEach(p => out.push(p + f)));
    out = tidy(out);
  }
  return out.slice(0, 35);
}
const BOARD_LANES = [
  { name:"LinkedIn", sites:["LinkedIn (linkedin.com/jobs)"] },
  { name:"Indeed", sites:["Indeed (indeed.com)"] },
  { name:"Dice", sites:["Dice (dice.com)"] },
  { name:"Glassdoor", sites:["Glassdoor (glassdoor.com)"] },
  { name:"Monster", sites:["Monster (monster.com)"] },
  { name:"ZipRecruiter", sites:["ZipRecruiter (ziprecruiter.com)"] },
  { name:"SimplyHired", sites:["SimplyHired (simplyhired.com)"] },
  { name:"Google Jobs", sites:["Google Jobs (google.com/search jobs)"] },
  { name:"Company Career Sites", sites:["Employer career pages (from your target employer list)"] }
];
function generateLanes(detection, targetEmployers, titleField){
  const lanes = [];
  /* sector lanes from detected industries */
  (detection.industries||[]).forEach(ind => {
    const inSector = (targetEmployers||[]).filter(e =>
      (INDUSTRY_WORDS[ind]||[]).some(w => e.toLowerCase().includes(w)));
    const pool = uniq([].concat(inSector, (detection.employers||[]).slice(0,8)));
    lanes.push({ id: uid("lane"), name: ind + " employers", kind:"sector",
      sites: pool.length? pool : ["Employers in the " + ind + " sector (add target employers in the wizard)"] });
  });
  /* the career field named in the title ALWAYS gets its lane, first in the grid: if none of the
     detected industries corresponds to it, prepend a field lane — a healthcare title must never
     end up with only some other field's lane showing */
  if(titleField){
    const stem = titleField.toLowerCase().slice(0, 6);
    const hasFieldLane = lanes.some(l => l.kind === "sector" && l.name.toLowerCase().includes(stem));
    if(!hasFieldLane){
      const pool = uniq([].concat(targetEmployers||[], (detection.employers||[]).slice(0,8)));
      lanes.unshift({ id: uid("lane"), name: titleField + " employers", kind:"sector",
        sites: pool.length? pool : ["Employers in the " + titleField + " field (add target employers in the wizard)"] });
    }
  }
  /* one lane for the target employer list itself when no sector matched */
  if(!lanes.length && (targetEmployers||[]).length){
    lanes.push({ id: uid("lane"), name:"Target employers", kind:"sector", sites: uniq(targetEmployers) });
  }
  BOARD_LANES.forEach(b => lanes.push({ id: uid("lane"), name: b.name, kind:"board", sites: b.sites.slice() }));
  return lanes;
}
async function generateCoverage(specifiedTitle){
  const det = STORE.profile.detection || {};
  let titles = generateTitles(specifiedTitle, det);
  let lanes = generateLanes(det, STORE.profile.employers.target || [], titleFieldWord(specifiedTitle));
  let widened = false;
  if(titles.length < 20 || lanes.length < 9){
    /* automatic widening pass: generate from every title the resume actually held —
       real held titles widen the set without inventing roles */
    let extra = [];
    (det.titles||[]).forEach(t => { extra = extra.concat(generateTitles(t, det)); });
    titles = uniq(titles.concat(extra)).slice(0, 35);
    widened = true;
  }
  STORE.coverage.specified_title = specifiedTitle;
  STORE.coverage.draft = { titles, lanes, generated_at: nowISO() };
  await storeSave("coverage", "Save draft coverage");
  if(widened) await noteWorkaround("Generated coverage came back thin ("+titles.length+" titles, "+lanes.length+" lanes) — automatically widened with broader variants and merged.");
  await logActivity("generation", "Generated a draft of "+titles.length+" titles and "+lanes.length+" lanes from the title “"+esc(specifiedTitle)+"”.");
  return STORE.coverage.draft;
}

/* ---------- profile completeness (drives the verify-at-login gate) ---------- */
function completeness(){
  const p = STORE.profile, c = STORE.coverage, a = STORE.answers, r = STORE.rules, cn = STORE.connections;
  const has = v => v != null && String(v).trim() !== "";
  const sections = [
    { id:"contact",  label:"Name & contact", step:1, ok: has(p.name) && has(p.email) && has(p.phone),
      detail: [p.name, p.email, p.phone].filter(Boolean).join(" · ") || "Nothing saved yet" },
    { id:"address",  label:"Home address", step:2, ok: has(p.address.street) && has(p.address.city) && has(p.address.state),
      detail: [p.address.street, p.address.city, p.address.state, p.address.zip].filter(Boolean).join(", ") || "Nothing saved yet" },
    { id:"resume",   label:"Resume & experience detection", step:3, ok: has(p.resume.text),
      detail: p.resume.text? ("Resume on file"+(p.detection && p.detection.years_experience? " · ~"+p.detection.years_experience+" yrs detected":"")+" · "+((p.detection&&p.detection.skills||[]).length)+" skills") : "No resume saved yet" },
    { id:"coverage", label:"Title & saved coverage", step:4, ok: (c.saved.titles||[]).length > 0 && (c.saved.lanes||[]).length > 0,
      detail: (c.saved.titles||[]).length? ((c.saved.titles.length)+" titles · "+(c.saved.lanes.length)+" lanes · saved "+fmtDate(c.saved.saved_at)) : "No saved coverage yet — drafts do not count" },
    { id:"linkedin", label:"LinkedIn", step:5, ok: has(cn.linkedin.profile_url),
      detail: cn.linkedin.profile_url || "No profile URL saved yet" },
    { id:"mailbox",  label:"Mailbox for codes & resets", step:6, ok: has(cn.mailbox.provider),
      detail: cn.mailbox.provider? (cn.mailbox.provider + (cn.mailbox.email? " · "+cn.mailbox.email : "")) : "No mailbox connected yet" },
    { id:"employers",label:"Employer lists", step:7, ok: (p.employers.target||[]).length > 0,
      detail: (p.employers.target||[]).length? ((p.employers.target.length)+" target · "+(p.employers.excluded.length)+" excluded") : "No target employers yet" },
    { id:"salary",   label:"Salary figures", step:8, ok: has(a.salary.range) || has(a.salary.single_figure) || has(a.salary.contract_hourly),
      detail: [a.salary.range, a.salary.single_figure && ("single: "+a.salary.single_figure), a.salary.contract_hourly && ("contract: "+a.salary.contract_hourly+"/hr")].filter(Boolean).join(" · ") || "Nothing saved yet" },
    { id:"rules",    label:"Hunt rules", step:9, ok: true,
      detail: (r.remote_only? "Remote only" : "Any location") + (r.minimum_pay? " · min "+r.minimum_pay : "") + ((r.focus_sectors||[]).length? " · focus: "+r.focus_sectors.join(", ") : "") },
    { id:"answers",  label:"Screening answers", step:10, ok: has(a.screening.work_authorization),
      detail: a.screening.work_authorization? "Saved — authorization, sponsorship, veteran status and more on file" : "Not answered yet" }
  ];
  const done = sections.filter(s => s.ok).length;
  return { sections, done, total: sections.length, complete: done === sections.length };
}

async function onConnect(){
  const name = $("#acctName").value.trim(), email = $("#acctEmail").value.trim();
  const owner = $("#ghOwner").value.trim(), repo = $("#ghRepo").value.trim(), token = $("#ghToken").value.trim();
  if(!owner || !repo || !token){ banner("Fill in owner, repo, and token to connect.", "warn"); return; }
  const prior = ghLoad();
  const btn = $("#btnConnect"); setBusy(btn, true, "Connecting…");
  GH = { owner, repo, token };
  try{
    const res = await ghFetch("/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo));
    if(res.status === 404) throw new Error("Repo not found. Check the owner and repo name — and that the repo exists and is accessible with this token.");
    if(res.status === 401 || res.status === 403) throw new Error("GitHub rejected that token ("+res.status+"). Make sure it is a fine-grained token with Contents read & write on this repo.");
    if(!res.ok) throw new Error("GitHub returned "+res.status+" while opening the repo.");
    ghSave();
    const created = await storeInit();
    await storeLoad();
    await checkEngineInstalled();
    const meta = accountLoad() || {};
    accountSave({ name: name || meta.name || (STORE.profile.name || ""), email: email || meta.email || (STORE.profile.email || ""),
      owner, repo, signed_out: false, created_at: meta.created_at || nowISO() });
    let seeded = false;
    if(STORE.profile){
      if(!STORE.profile.name && name){ STORE.profile.name = name; seeded = true; }
      if(!STORE.profile.email && email){ STORE.profile.email = email; seeded = true; }
    }
    if(seeded) await storeSave("profile", "Account details");
    if(created.length) await logActivity("setup", "Initialized the data store in "+owner+"/"+repo+": created "+created.join(", ")+".");
    banner("");
    if(created.length){ renderWizard(1); return; }
    const hasProfile = STORE.profile && (STORE.profile.name || STORE.profile.resume.text);
    if(hasProfile){ renderVerify(); }
    else { renderWizard(1); }
  }catch(e){
    GH = prior; if(prior) ghSave(); else ghClear();
    setBusy(btn, false);
    renderConnect({owner, repo, token, name, email}, e.message || String(e));
  }
}

async function signIn(){

async function loadStoreAndRoute(){

    if(hasProfile) renderVerify(); else renderWizard(STORE.profile.wizard_step || 1);

      '<button class="btn ghost" id="btnRetryBoot">Try again</button> <button class="btn ghost" id="btnForgetBoot">Forget &amp; start over</button></div>';
    $("#btnRetryBoot").addEventListener("click", loadStoreAndRoute);

/* ---------- boot ---------- */
async function boot(){
  const saved = ghLoad();
  const a = accountLoad();
  if(!saved || !saved.token){
    if(a && a.owner){ renderConnect({ owner:a.owner, repo:a.repo, token:"", name:a.name || "", email:a.email || "" }, ""); return; }
    renderConnect(null, "");
    return;
  }
  if(a && a.signed_out){ renderLogin(); return; }
  GH = saved;
  if(!a) accountSave({ name:"", email:"", owner:saved.owner, repo:saved.repo, signed_out:false, created_at: nowISO() });
  await loadStoreAndRoute();
}
/* ---------- signup wizard (11 steps) ---------- */
const WIZ_STEPS = ["Contact","Address","Resume","Title & coverage","LinkedIn","Mailbox","Employers","Salary","Rules","Answers","Review & save"];
let WIZ = 1;
function wizShell(step, inner){
  const dots = WIZ_STEPS.map((s,i)=>{
    const n = i+1;
    return '<div class="stepdot '+(n===step?"on":(n<step?"done":""))+'" title="'+esc(s)+'">'+n+'</div>';
  }).join("");
  view().innerHTML = `
  <div class="card">
    <div class="flexbetween">
      <p class="label">Set up your hunt · Step ${step} of 11</p>
      <button class="btn ghost small" id="wizExit" type="button">✕ Exit to dashboard</button>
    </div>
    <h2 style="margin:0 0 4px;font-size:21px">${esc(WIZ_STEPS[step-1])}</h2>
    <div class="steps mt">${dots}</div>
    <div id="wizBody">${inner}</div>
    <div class="flexbetween mt">
      <button class="btn ghost" id="wizBack" ${step===1?"disabled":""}>← Back</button>
      <span class="sub small">Progress saves to your repo as you go.</span>
      <button class="btn" id="wizNext">${step===11? "Save everything" : "Save & continue →"}</button>
    </div>
  </div>`;
  $("#wizBack").addEventListener("click", ()=> renderWizard(Math.max(1, step-1)));
  $("#wizNext").addEventListener("click", ev => wizNext(step, ev.currentTarget));
  const wx = $("#wizExit"); if(wx) wx.addEventListener("click", () => renderDashboard());
}
function renderWizard(step){
  WIZ = step;
  headActions('<button class="btn ghost small" id="btnHeadDisc">Sign out</button>');
  const d = $("#btnHeadDisc"); if(d) d.addEventListener("click", signOut);
  const renderers = {1:wizStep1,2:wizStep2,3:wizStep3,4:wizStep4,5:wizStep5,6:wizStep6,7:wizStep7,8:wizStep8,9:wizStep9,10:wizStep10,11:wizStep11};
  (renderers[step] || wizStep1)();
}
async function wizPersist(step){
  try{
    if(step <= 3 || step === 7) await storeSave("profile", "Wizard step "+step+" (profile)");
    if(step === 4) await storeSave("coverage", "Wizard step 4 (coverage)");
    if(step === 5 || step === 6) await storeSave("connections", "Wizard step "+step+" (connections)");
    if(step === 8 || step === 10) await storeSave("answers", "Wizard step "+step+" (answers)");
    if(step === 9) await storeSave("rules", "Wizard step 9 (rules)");
    STORE.profile.wizard_step = Math.max(STORE.profile.wizard_step||1, Math.min(11, step+1));
    if(step !== 3 && step !== 7 && step !== 1 && step !== 2) await storeSave("profile", "Wizard progress");
  }catch(e){ banner("Saving to your repo hit a problem: "+esc(e.message||String(e))+" — your entries are still on this screen; try Continue again.", "err"); throw e; }
}
async function wizNext(step, btn){
  const collect = {1:collect1,2:collect2,3:collect3,4:collect4,5:collect5,6:collect6,7:collect7,8:collect8,9:collect9,10:collect10,11:collect11}[step];
  if(collect) collect();
  setBusy(btn, true, "Saving…");
  try{
    await wizPersist(step);
    banner("");
    if(step === 11){ toast("Saved to your repo and verified."); renderVerify(); return; }
    renderWizard(step+1);
  }catch(e){ setBusy(btn, false); }
}

/* ===== Sweep Tracker port — helpers, theme, gauges ===== */
function tkTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", timeZoneName:"short" });
}
function tkFull(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  const day = d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric", year:"numeric" });
  return day + " · " + tkTime(iso);
}
function tkDay(dateStr){
  if(!dateStr) return "";
  const d = new Date(String(dateStr).slice(0, 10) + "T12:00:00");
  if(isNaN(d)) return String(dateStr);
  return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
}
function tkDur(ms){
  let t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if(h > 0) return h + "h " + String(m).padStart(2, "0") + "m";
  if(m > 0) return m + "m " + String(s).padStart(2, "0") + "s";
  return s + "s";
}
function tkGauge(value, tone){
  const color = tone === "green"? "var(--green)" : tone === "amber"? "var(--amber)" : tone === "red"? "var(--red)" : "var(--accent)";
  const soft = tone === "green"? "var(--green-soft)" : tone === "amber"? "var(--amber-soft)" : tone === "red"? "var(--red-soft)" : "var(--accent-soft)";
  const digits = String(Math.abs(Math.trunc(value || 0))).length;
  const size = digits >= 4? 24 : digits === 3? 30 : 38;
  return '<span class="tk-gauge" role="img" aria-label="' + esc(String(value || 0)) + '">'
    + '<svg viewBox="0 0 104 104" style="display:block;height:104px;width:104px" aria-hidden="true">'
    + '<circle cx="52" cy="52" r="40" fill="' + soft + '"></circle>'
    + '<circle cx="52" cy="52" r="40" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round"></circle></svg>'
    + '<span class="tk-gaugenum" style="font-size:' + size + 'px">' + esc(String(value || 0)) + '</span></span>';
}
function tkDonut(pct, tone){
  const a = Math.max(0, Math.min(100, Math.round(pct || 0)));
  const stroke = tone === "green"? "var(--green)" : tone === "amber"? "var(--amber)" : tone === "red"? "var(--red)" : "var(--dim)";
  const C = (2 * Math.PI * 40).toFixed(2);
  const off = (2 * Math.PI * 40 * (1 - a / 100)).toFixed(2);
  return '<span class="tk-donut"><svg viewBox="0 0 104 104" style="display:block;height:104px;width:104px">'
    + '<circle cx="52" cy="52" r="40" fill="none" stroke="var(--pill-bg)" stroke-width="10"></circle>'
    + '<circle cx="52" cy="52" r="40" fill="none" stroke="' + stroke + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '" transform="rotate(-90 52 52)" style="transition:stroke-dashoffset 1s ease-out"></circle></svg>'
    + '<span class="tk-donutnum">' + a + '%</span></span>';
}
function tkVerdictTone(v){
  const t = String(v || "").toLowerCase();
  if(/(fail|violat|not followed|not met|missed|breach|incorrect)/.test(t)) return "red";
  if(/(pass|followed|\bmet\b|verified|compliant|correct|\bok\b|\byes\b|ready|recorded|email-confirmed)/.test(t)) return "green";
  return "amber";
}

    if(s === "light" || s === "dark") return s;

  try{ if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark"; }catch(e){}
  return "light";
}
function tkThemeInit(){

/* ===== coverage lanes — tracker tiles + drill-down ===== */
function laneEntry(lane){
  const runs = STORE.runs;
  return ((runs.current_run && runs.current_run.lanes) || []).find(x => x.name === lane.name) || null;
}
function laneState(lane){
  const runs = STORE.runs;
  const e = laneEntry(lane);
  const total = e && typeof e.total === "number"? e.total : (lane.kind === "board"? 1 : (lane.sites || []).length);
  const done = e && typeof e.done === "number"? e.done : 0;
  if(e){
    if(e.status === "searching") return { word: "Searching", tone: "amber", pct: total? Math.round(100 * done / total) : 0, done, total, detail: e.detail || "", entry: e };
    if(e.status === "done") return { word: "Done", tone: "green", pct: 100, done: total, total, detail: e.detail || "", entry: e };
    if(e.status === "manual") return { word: "Manual", tone: "dim", pct: 0, done, total, detail: e.detail || "", entry: e };
    if(e.status === "stopped") return { word: "Stopped", tone: "red", pct: total? Math.round(100 * done / total) : 0, done, total, detail: e.detail || "", entry: e };
    return { word: runs.state === "running"? "Waiting" : "Not searched", tone: "dim", pct: 0, done, total, detail: e.detail || "", entry: e };
  }
  if(runs.state === "idle" && runs.history && runs.history.length){
    const h = runs.history[0];
    const he = ((h && h.lanes) || []).find(x => x.name === lane.name);
    if(he && he.status === "done") return { word: "Done", tone: "green", pct: 100, done: total, total, detail: he.detail || "", entry: he };
    if(he && he.status === "manual") return { word: "Manual", tone: "dim", pct: 0, done, total, detail: he.detail || "", entry: he };
  }
  return { word: runs.state === "running"? "Waiting" : "Not searched", tone: "dim", pct: 0, done, total, detail: "", entry: null };
}
function laneJobs(lane){
  const sites = (lane.sites || []).map(s => String(s).toLowerCase());
  return (STORE.filings.filings || []).filter(f => {
    if(String(f.filed_at || "").slice(0, 10) !== todayStr()) return false;
    const co = String(f.company || "").toLowerCase();
    return co && sites.some(s => s.includes(co) || co.includes(s.replace(/^https?:\/\//, "").split("/")[0]));
  });
}
function openLanePanel(idx){
  const saved = STORE.coverage.saved || { lanes: [] };

  OPEN_LANE = idx;
  const box = $("#lanePanel"); if(!box) return;
  const st = laneState(lane);
  const jobs = laneJobs(lane);
  const tonePill = st.tone === "green"? "green" : st.tone === "amber"? "amber" : st.tone === "red"? "red" : "grey";
  const unitLine = lane.kind === "board"? "Searched in your browser" : st.done + "/" + st.total + " employers searched";
  let html = '<div class="tk-card" style="margin-top:16px;padding:20px 22px" aria-label="' + esc(lane.name) + ' — all entries">'
    + '<div class="tk-panelhead"><h3>' + esc(lane.name) + ' — all entries</h3>'
    + '<span class="tk-statepill ' + tonePill + '" style="text-transform:uppercase;font-size:11.5px;letter-spacing:.05em">' + esc(st.word) + '</span>'

    + '<div style="margin-top:16px"><h4 style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0">Websites in this lane · ' + (lane.sites || []).length + '</h4>'
    + ((lane.sites || []).length
      ? '<ol style="list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:6px">' + lane.sites.map((s, i) => '<li class="tk-siterow"><span class="tk-sitenum">' + (i + 1) + '.</span><span style="min-width:0;word-break:break-word;font-size:14.5px;font-weight:600;color:var(--ink-2)">' + esc(s) + '</span></li>').join("") + '</ol>'
      : '<p style="margin-top:3px;color:var(--ink-2)">No websites are saved for this lane yet.</p>')
    + '</div>';
  if(jobs.length){
    html += '<div style="margin-top:16px"><h4 style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0">Jobs from this lane · ' + jobs.length + '</h4>'
      + '<table class="tk-table" style="font-size:15px" aria-label="Jobs dispositioned by ' + esc(lane.name) + ' today"><colgroup><col style="width:25%"><col style="width:14%"><col style="width:37%"><col style="width:24%"></colgroup>'
      + '<thead><tr><th>Job</th><th>Where</th><th>Outcome</th><th class="r">Action</th></tr></thead><tbody>'
      + jobs.map(f => {
          if(f.status === "filed") return '<tr><td><span style="display:block;font-weight:700">' + esc(f.company) + '</span>' + (f.role? '<span style="display:block;margin-top:2px;font-size:14px;color:var(--ink-2)">' + esc(f.role) + '</span>' : '') + '</td>'
            + '<td><span class="tk-where grey">' + esc(f.where || "") + '</span></td>'
            + '<td><span class="tk-statepill green">✓ Filed</span>' + (f.filed_at? '<span style="margin-left:8px;font-size:13px;color:var(--dim)">' + esc(tkTime(f.filed_at)) + '</span>' : '') + '</td>'
            + '<td style="text-align:right;font-size:13.5px;color:var(--dim)">Completed</td></tr>';
          const parked = f.status === "parked";
          return '<tr><td><span style="display:block;font-weight:700">' + esc(f.company) + '</span>' + (f.role? '<span style="display:block;margin-top:2px;font-size:14px;color:var(--ink-2)">' + esc(f.role) + '</span>' : '') + '</td>'
            + '<td><span class="tk-where grey">' + esc(f.where || "") + '</span></td>'
            + '<td><span class="tk-statepill ' + (parked? "amber" : "red") + '">' + (parked? "Parked" : "Rejected") + '</span>'
            + '<span style="display:block;margin-top:4px;line-height:1.4;color:var(--ink-2)">' + esc(f.reason || "") + '</span></td>'
            + '<td style="text-align:right"><button type="button" class="tk-rowbtn accent" data-' + (parked? 'relaunch="' : 'retry="') + esc(f.id) + '">' + (parked? "Relaunch" : "Retry") + '</button></td></tr>';
        }).join("")
      + '</tbody></table></div>';
  }
  html += '<div style="margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:16px">'
    + '<button type="button" class="tk-rowbtn accentsoft" id="btnLaneRestart" style="padding:10px 20px;font-size:15px">Restart ' + esc(lane.name) + '</button>'
    + '<button type="button" class="tk-rowbtn track" id="btnLanePriority" style="padding:10px 20px;font-size:15px">Toggle priority</button>'
    + '<span id="laneCtlMsg" style="font-size:13.5px;color:var(--dim)"></span></div>'
    + '</div>';
  box.innerHTML = html;
  const panel = box.firstElementChild;
  if(panel && panel.scrollIntoView) panel.scrollIntoView({ behavior: "smooth", block: "start" });
  $("#btnLaneClose").addEventListener("click", () => { OPEN_LANE = null; box.innerHTML = ""; });
  $("#btnLanePriority").addEventListener("click", () => laneControl(lane, "priority"));
  $("#btnLaneRestart").addEventListener("click", () => laneControl(lane, "restart"));
  $$("#lanePanel [data-relaunch]").forEach(b => b.addEventListener("click", () => requestRework(b.getAttribute("data-relaunch"), "relaunch")));
  $$("#lanePanel [data-retry]").forEach(b => b.addEventListener("click", () => requestRework(b.getAttribute("data-retry"), "retry")));
}

/* ===== titles — tracker section writers ===== */
async function titlesSave(msg){
  try{
    await storeSave("coverage", msg || "Update titles");
  }catch(e){ banner("Saving titles failed: " + esc(e.message || String(e)), "err"); }
}
async function titlesAddFromText(text){
  const cov = STORE.coverage;
  cov.saved = cov.saved || { titles: [], lanes: [] };
  cov.removed_titles = Array.isArray(cov.removed_titles)? cov.removed_titles : [];
  cov.added_titles = Array.isArray(cov.added_titles)? cov.added_titles : [];
  const incoming = String(text || "").split(/[\n,]+/).map(s => s.trim().replace(/\s+/g, " ")).filter(Boolean);
  if(!incoming.length){ DASH_UI.titlesMsg = "Paste at least one title first — one per line, or separated by commas."; renderDashboard(); return; }
  const have = new Set((cov.saved.titles || []).map(t => t.toLowerCase()));
  const removedMap = new Map(cov.removed_titles.map(t => [t.toLowerCase(), t]));
  const seen = new Set();
  let added = 0, restored = 0, skipped = 0, tooLong = 0;
  for(const t of incoming){
    const k = t.toLowerCase();
    if(seen.has(k)){ skipped++; continue; }
    seen.add(k);
    if(t.length > 120){ tooLong++; continue; }
    if(have.has(k)){ skipped++; continue; }
    if(removedMap.has(k)){
      cov.removed_titles = cov.removed_titles.filter(x => x.toLowerCase() !== k);
      cov.saved.titles.push(removedMap.get(k));
      restored++; continue;
    }
    cov.saved.titles.push(t);
    cov.added_titles.push(t);
    added++;
  }
  if(!added && !restored){
    DASH_UI.titlesMsg = skipped > 0 && !tooLong? "Nothing new to add — every pasted title is already on the list." : "Nothing could be added — check the titles and try again.";
    renderDashboard(); return;
  }
  const parts = [];
  if(added) parts.push(added + (added === 1? " title" : " titles") + " added");
  if(restored) parts.push(restored + " restored");
  if(skipped) parts.push(skipped + " already on the list, skipped");
  if(tooLong) parts.push(tooLong + " too long, skipped");
  DASH_UI.titlesMsg = parts.join(" · ") + " — searched as title families from the next run.";
  DASH_UI.addTitlesOpen = false;
  await titlesSave("Add titles");
  await logActivity("setup", "Titles updated: " + DASH_UI.titlesMsg);
  renderDashboard();
}
async function titlesRemove(title){
  const cov = STORE.coverage;
  cov.saved = cov.saved || { titles: [], lanes: [] };
  cov.removed_titles = Array.isArray(cov.removed_titles)? cov.removed_titles : [];
  cov.added_titles = Array.isArray(cov.added_titles)? cov.added_titles : [];
  const k = title.toLowerCase();
  if(cov.added_titles.some(t => t.toLowerCase() === k)){
    cov.added_titles = cov.added_titles.filter(t => t.toLowerCase() !== k);
    cov.saved.titles = (cov.saved.titles || []).filter(t => t.toLowerCase() !== k);
  } else {
    cov.saved.titles = (cov.saved.titles || []).filter(t => t.toLowerCase() !== k);
    if(!cov.removed_titles.some(t => t.toLowerCase() === k)) cov.removed_titles.push(title);
  }
  DASH_UI.selTitles = DASH_UI.selTitles.filter(t => t !== title);
  DASH_UI.titlesMsg = "“" + title + "” removed — it will not be searched from the next run. Restore it any time below the list.";
  await titlesSave("Remove title");
  renderDashboard();
}
async function titlesRestore(){
  const cov = STORE.coverage;
  cov.saved = cov.saved || { titles: [], lanes: [] };
  const back = Array.isArray(cov.removed_titles)? cov.removed_titles : [];
  back.forEach(t => { if(!(cov.saved.titles || []).some(x => x.toLowerCase() === t.toLowerCase())) cov.saved.titles.push(t); });
  cov.removed_titles = [];
  DASH_UI.titlesMsg = "Removed titles restored — the full list is searched again from the next run.";
  await titlesSave("Restore titles");
  renderDashboard();
}
async function titlesScopeRequest(){
  const titles = DASH_UI.selTitles.slice();
  if(!titles.length) return;
  try{
    STORE.runs.requests = Array.isArray(STORE.runs.requests)? STORE.runs.requests : [];
    STORE.runs.requests.push({ id: uid("req"), kind: "title-scope", titles, at: nowISO() });
    await storeSave("runs", "Title scope request");
    await logActivity("control", "Title search requested — the next hunt searches only these " + titles.length + " titles: " + titles.join(", ") + ".");
    DASH_UI.titlesMsg = "Search requested — the next hunt will search only these " + titles.length + " title " + (titles.length === 1? "family" : "families") + ".";
    DASH_UI.selectingTitles = false;
    renderDashboard();
  }catch(e){ banner("Could not save the title search: " + esc(e.message || String(e)), "err"); }
}
