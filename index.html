<body>
<div class="wrap">
  <header class="brand">
    <div class="brand-left">
      <div class="logo">G</div>
      <div>
        <h1 class="brandname">Get Me A JOB</h1>
        <p class="tagline">Your job hunt, run from your own GitHub repo.</p>
      </div>
    </div>
    <div id="headActions"></div>
  </header>
  <div id="banner"></div>
  <main id="view"><div class="card"><p class="sub">Loading…</p></div></main>
  <p class="sub small" style="text-align:center;margin-top:26px">
    Get Me A JOB runs entirely in your browser. Your data lives only in your own GitHub repository —
    this page talks to <span class="mono">api.github.com</span> and nowhere else.
  </p>
</div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
/* ============================================================
   Get Me A JOB — single-file standalone job-hunt tracker.
   All state lives in the user's own GitHub repo (data/*.json)
   via the GitHub Contents API. Token lives only in this
   browser's localStorage. No other network calls exist.
   ============================================================ */

/* ---------- small utilities ---------- */
const $  = (sel, el) => (el||document).querySelector(sel);
const $$ = (sel, el) => Array.from((el||document).querySelectorAll(sel));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO = () => new Date().toISOString();
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = p => (p||"id")+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
const lines = t => String(t||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
const uniq = arr => Array.from(new Set((arr||[]).map(x=>String(x).trim()).filter(Boolean)));
const clone = o => JSON.parse(JSON.stringify(o==null?null:o));
function toast(msg, ms){ const t=$("#toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add("hidden"), ms||3400); }
function banner(html, kind){ const b=$("#banner"); if(!html){ b.innerHTML=""; return; } b.innerHTML='<div class="notice '+(kind||"info")+'">'+html+'</div>'; }
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64||"").replace(/\s/g,""));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? "—" : d.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? String(iso).slice(0,10) : d.toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"}); }

/* ---------- GitHub Contents API layer ---------- */
const GH_KEY = "getMeAJobGh";           // localStorage key: {owner, repo, token}
const API = "https://api.github.com";
let GH = null;                          // {owner, repo, token} once connected

function ghLoad(){ try{ const raw = localStorage.getItem(GH_KEY); return raw? JSON.parse(raw): null; }catch(e){ return null; } }
function ghSave(){ try{ localStorage.setItem(GH_KEY, JSON.stringify(GH)); }catch(e){} }
function ghClear(){ try{ localStorage.removeItem(GH_KEY); }catch(e){} GH = null; }

async function ghFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  }, opts.headers||{});
  if(GH && GH.token) headers["Authorization"] = "Bearer " + GH.token;
  if(opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  const res = await fetch(API + path, Object.assign({}, opts, {headers}));
  return res;
}
const repoPath = p => "/repos/" + encodeURIComponent(GH.owner) + "/" + encodeURIComponent(GH.repo) + "/contents/" + p.split("/").map(encodeURIComponent).join("/");

/* Read one file from the repo. Returns {exists, data, sha, raw}. Throws on auth/network errors. */
async function ghReadFile(path){
  const res = await ghFetch(repoPath(path));
  if(res.status === 404) return {exists:false, data:null, sha:null};
  if(res.status === 401 || res.status === 403){
    const t = await res.text().catch(()=> "");
    throw new Error("GitHub rejected the token ("+res.status+"). Check that the token has Contents read & write on this repo. " + (t.slice(0,140)));
  }
  if(!res.ok) throw new Error("GitHub read failed ("+res.status+") for "+path);
  const j = await res.json();
  const text = b64decode(j.content||"");
  let data = null;
  try{ data = JSON.parse(text); }catch(e){ data = null; }
  return {exists:true, data, sha:j.sha, raw:text};
}

/* Write one file with sha-aware conflict handling + read-back verification.
   On 409/422: re-read, let mergeFn(latestData) produce the merged object, retry (up to 3). */
async function ghWriteFile(path, data, message, mergeFn){
  let attempt = 0, current = data, lastErr = null;
  while(attempt < 4){
    attempt++;
    let sha = null;
    try{
      const cur = await ghReadFile(path);
      sha = cur.exists? cur.sha: null;
      if(attempt > 1 && mergeFn && cur.exists && cur.data) current = mergeFn(cur.data, current);
    }catch(e){ /* read failure is handled by the PUT path below / surfaced on retry */ }
    const body = { message: message || ("Update "+path), content: b64encode(JSON.stringify(current, null, 2)) };
    if(sha) body.sha = sha;
    let res;
    try{ res = await ghFetch(repoPath(path), {method:"PUT", body: JSON.stringify(body)}); }
    catch(e){ lastErr = e; await sleep(600); continue; }
    if(res.status === 200 || res.status === 201){
      /* read-back verification */
      try{
        const back = await ghReadFile(path);
        if(back.exists && JSON.stringify(back.data) === JSON.stringify(current)) return {ok:true, attempts:attempt};
        lastErr = new Error("Read-back did not match what was written for "+path);
      }catch(e){ lastErr = e; }
      await sleep(500); continue;
    }
    if(res.status === 409 || res.status === 422){
      lastErr = new Error("Write conflict on "+path+" ("+res.status+")");
      await logActivity("workaround", "Write conflict on "+path+" — re-read the latest copy, merged, and retried (attempt "+attempt+").");
      await sleep(500); continue;
    }
    if(res.status === 401 || res.status === 403){
      const t = await res.text().catch(()=> "");
      throw new Error("GitHub rejected the write ("+res.status+"). The token needs Contents: Read and write on this repo. "+t.slice(0,140));
    }
    const t = await res.text().catch(()=> "");
    lastErr = new Error("GitHub write failed ("+res.status+") for "+path+": "+t.slice(0,160));
    await sleep(600);
  }
  throw lastErr || new Error("Could not write "+path+" after several attempts.");
}
const sleep = ms => new Promise(r=>setTimeout(r, ms));


/* ---------- data store: data/*.json in the user's repo ---------- */
const DATA_DIR = "data";
const FILES = {
  profile:     DATA_DIR + "/profile.json",
  coverage:    DATA_DIR + "/coverage.json",
  rules:       DATA_DIR + "/rules.json",
  answers:     DATA_DIR + "/answers.json",
  connections: DATA_DIR + "/connections.json",
  runs:        DATA_DIR + "/runs.json",
  filings:     DATA_DIR + "/filings.json",
  codes:       DATA_DIR + "/codes.json",
  activity:    DATA_DIR + "/activity.json"
};
function defaultsFor(key){
  switch(key){
    case "profile": return { name:"", email:"", phone:"",
      address:{ street:"", city:"", state:"", zip:"", country:"" },
      resume:{ filename:"", added_at:"", text:"" },
      detection:{ skills:[], employers:[], titles:[], industries:[], years_experience:"", summary:"" },
      employers:{ target:[], excluded:[] },
      wizard_step: 1, updated_at:"" };
    case "coverage": return { specified_title:"", draft:{ titles:[], lanes:[], generated_at:"" },
      saved:{ titles:[], lanes:[], saved_at:"" }, coverage_saved_at:"", updated_at:"" };
    case "rules": return { remote_only:true, minimum_pay:"", focus_sectors:[], always_reject:[],
      extra_notes:"", updated_at:"" };
    case "answers": return { salary:{ range:"", single_figure:"", contract_hourly:"" },
      screening:{ work_authorization:"", sponsorship_now:"", sponsorship_future:"", over_18:"",
        veteran_status:"", disability:"", gender:"", race_ethnicity:"", clearance_eligibility:"",
        travel:"", relocate:"", how_heard:"" },
      skill_years:{}, updated_at:"" };
    case "connections": return { linkedin:{ profile_url:"", connected:false, connected_at:"" },
      mailbox:{ provider:"", email:"", client_id:"", connected:false, connected_at:"", last_checked_at:"" }, updated_at:"" };
    case "runs": return { state:"idle", current_run:null, history:[], lane_controls:[], requests:[], updated_at:"" };
    case "filings": return { filings:[], updated_at:"" };
    case "codes": return { codes:[], updated_at:"" };
    case "activity": return { entries:[], updated_at:"" };
  }
  return {};
}
/* In-memory mirror of the repo files + their shas are re-read per write (ghWriteFile handles shas). */
let STORE = null;   // {profile:{...}, coverage:{...}, ...}
let STORE_LOADED_AT = "";

async function storeInit(){
  /* Create any missing data files (empty defaults). Records what it did in activity. */
  const created = [];
  for(const key of Object.keys(FILES)){
    const r = await ghReadFile(FILES[key]);
    if(!r.exists){
      await ghWriteFile(FILES[key], defaultsFor(key), "Initialize "+FILES[key]);
      created.push(FILES[key]);
    } else if(r.data == null){
      /* file exists but is not valid JSON — recreate it empty rather than dead-end */
      await ghWriteFile(FILES[key], defaultsFor(key), "Repair "+FILES[key]+" (was not valid JSON)");
      created.push(FILES[key]+" (repaired)");
    }
  }
  return created;
}
async function storeLoad(){
  STORE = {};
  for(const key of Object.keys(FILES)){
    const r = await ghReadFile(FILES[key]);
    STORE[key] = r.exists && r.data? Object.assign(defaultsFor(key), r.data) : defaultsFor(key);
  }
  STORE_LOADED_AT = nowISO();
  return STORE;
}
/* Save one store section back to the repo (merge-on-conflict keeps the newest of each top-level key). */
async function storeSave(key, message){
  STORE[key].updated_at = nowISO();
  const snapshot = clone(STORE[key]);
  const res = await ghWriteFile(FILES[key], snapshot, message || ("Update "+FILES[key]), (latest, mine) => {
    return Object.assign({}, latest, mine);
  });
  return res;
}
/* Activity log lives in the repo too; logging must never break the app, so failures are swallowed. */
async function logActivity(kind, message){
  try{
    if(!STORE) return;
    STORE.activity.entries = Array.isArray(STORE.activity.entries)? STORE.activity.entries: [];
    STORE.activity.entries.unshift({ id: uid("act"), at: nowISO(), kind: kind||"info", message: String(message||"") });
    STORE.activity.entries = STORE.activity.entries.slice(0, 400);
    await storeSave("activity", "Log activity");
  }catch(e){ /* never surface logging failures as app failures */ }
}
async function noteWorkaround(message){ await logActivity("workaround", message); }

/* ---------- resume text extraction + detection ---------- */
const SKILL_WORDS = [

  "Windows Server","Active Directory","VMware","Hyper-V","Linux","PowerShell","Bash","Python","JavaScript",
  "SQL","SQL Server","MySQL","PostgreSQL","Oracle","Networking","TCP/IP","DNS","DHCP","VPN","Firewalls",
  "Cybersecurity","Security","Compliance","Entra ID","Intune","Exchange","SharePoint",
  "Terraform","Ansible","Docker","Kubernetes","CI/CD","DevOps","Git","Agile","Scrum","Project Management",
  "Data Analysis","Excel","Power BI","Tableau","Salesforce","SAP","ServiceNow","ITIL","Help Desk",
  "Technical Support","Cloud Migration","Architecture","Solutions Architecture","Enterprise Architecture",
  "Machine Learning","Data Engineering","ETL","APIs","REST","Customer Service","Training","Documentation",
  "Healthcare IT","HIPAA","Finance","Accounting","Human Resources","Operations",
  /* data & analytics */
  "pandas","NumPy","Snowflake","Looker","dbt","Google Analytics","A/B Testing","Data Visualization",
  "Data Modeling","Statistical Analysis","Forecasting","BigQuery","Redshift","Data Warehousing","R Programming",
  /* healthcare & clinical */
  "Epic EHR","Cerner","MEDITECH","EHR","EMR","Critical Care","Patient Care","Patient Assessment",

  "Clinical Documentation","Infection Control","Triage","Phlebotomy","Care Planning",
  /* engineering & design */
  "SolidWorks","AutoCAD","Revit","ANSYS","FEA","Finite Element Analysis","GD&T","HVAC","HVAC Design",
  "Load Calculations","Energy Modeling","ASHRAE","MATLAB","Creo","CATIA","BIM","Navisworks","Commissioning",
  "Thermodynamics","Fluid Mechanics","Blueprint Reading","Tolerance Analysis","Energy Audits",
  /* marketing & growth */
  "HubSpot","Google Ads","LinkedIn Ads","SEO","SEM","Content Strategy","Content Marketing","Digital Marketing",
  "Marketing Automation","Email Marketing","Social Media Marketing","WordPress","Campaign Management",

/* everyday words that also name skills — only trusted inside the resume's own Skills section,
   so prose like "supply chain teams" or an employer's name never becomes a detected skill */
const AMBIGUOUS_SKILLS = ["Teams","Sales","Identity","Marketing"];
const INDUSTRY_WORDS = {
  "Healthcare": ["healthcare","health","hospital","clinic","patient","medical","pharma","biotech","hipaa","ehr","epic","nurse","nursing"],
  "Finance & Banking": ["bank","financial","finance","insurance","fintech","payments","trading","audit"],
  "Technology": ["software","saas","technology","it services","cloud","startup","platform"],
  "Energy & Utilities": ["energy","oil","gas","utility","utilities","power generation","electric power","power plant","renewable","petroleum"],
  "Government": ["government","federal","state agency","public sector","municipal","defense"],
  "Education": ["university","college","school","academic","school district","education sector"],
  "Retail & E-commerce": ["retail","e-commerce","ecommerce","store","consumer","merchandising"],
  "Manufacturing": ["manufacturing","factory","plant","industrial","production"],
  "Logistics & Transportation": ["logistics","transportation","shipping","warehouse","fleet","freight","supply chain"],
  "Media & Entertainment": ["media","entertainment","broadcast","publishing","advertising","streaming"]
};
const TITLE_HINTS = ["architect","engineer","analyst","manager","administrator","consultant","specialist",
  "designer","developer","scientist","lead","director","coordinator","technician","support","strategist","owner",
  "nurse","therapist","pharmacist","teacher","officer","supervisor","representative","accountant","auditor","counselor"];

const SECTION_HEADERS = {
  "summary":"summary","profile":"summary","objective":"summary","professional summary":"summary",
  "experience":"experience","work experience":"experience","professional experience":"experience",
  "employment":"experience","employment history":"experience","work history":"experience",
  "skills":"skills","technical skills":"skills","core competencies":"skills","key skills":"skills","qualifications":"skills",
  "education":"education","licenses":"education","licenses and education":"education",
  "certifications":"education","education and certifications":"education"
};
function sectionOfLine(ln){
  const t = ln.trim().replace(/:$/,"");
  if(!t || t.length > 42) return null;
  if(/^[A-Z][A-Z &\/\-]+$/.test(t)) return SECTION_HEADERS[t.toLowerCase()] || "other";
  return SECTION_HEADERS[t.toLowerCase()] || null;
}
function detectFromResume(text){
  const clean = String(text||"");
  const low = clean.toLowerCase();
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const hasWord = (hay, s) => new RegExp("(^|[^a-z0-9])"+escRe(String(s).toLowerCase())+"([^a-z0-9]|$)", "i").test(hay);
  /* split into sections so education/licenses never masquerade as experience */
  const secs = { preamble:[], summary:[], experience:[], skills:[], education:[], other:[] };
  let cur = "preamble";
  lines(clean).forEach(ln => {
    const h = sectionOfLine(ln);
    if(h){ cur = h; return; }
    secs[cur].push(ln);
  });
  const secText = k => secs[k].join("\n");
  const expText = secText("experience");
  const skillsText = secText("skills");
  const summaryText = secText("summary");
  const empSource = expText.trim()? expText : [secText("preamble"), summaryText, secText("other")].join("\n");
  /* employers + held titles from "Title — Company, City, ST" header lines */
  const employers = [];
  const pushEmp = name => {
    const n = String(name||"").trim().replace(/[,.;]+$/,"").trim();
    if(n.length >= 2 && n.length <= 50 && /[a-z]/i.test(n) && !/^(present|current|various|multiple)$/i.test(n)
       && !employers.some(e => e.toLowerCase() === n.toLowerCase())) employers.push(n);
  };
  const heldTitles = [];
  const pushTitle = t => {
    const c = String(t||"").split(",")[0].replace(/[•·].*$/,"").replace(/\s{2,}/g," ").trim();
    if(c.length >= 3 && c.length <= 60 && !heldTitles.some(x => x.toLowerCase() === c.toLowerCase())) heldTitles.push(c);
  };
  empSource.split("\n").forEach(ln => {
    const parts = ln.split(/\s+[—–]\s+|\s+\|\s+/);
    if(parts.length >= 2){
      const cand = parts[parts.length-1].trim()
        .replace(/,\s*[^,]+,\s*[A-Z]{2}(\s+\d{5})?\s*$/,"")
        .replace(/,\s*(19|20)\d{2}\s*$/,"").trim();
      if(!/(19|20)\d{2}/.test(cand) && !/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(cand)) pushEmp(cand);
      if(TITLE_HINTS.some(h => parts[0].toLowerCase().includes(h))) pushTitle(parts[0]);
    }
  });
  let m;
  const atRe = /\bat\s+([A-Z][A-Za-z0-9&.'’\-]+(?:\s+[A-Z][A-Za-z0-9&.'’\-]+){0,3})/g;
  const empHay = empSource + "\n" + summaryText;
  while((m = atRe.exec(empHay)) !== null) pushEmp(m[1]);
  /* titles held: the title line under the name, plus a guarded hint scan (no bullets, no degree lines) */
  secs.preamble.slice(1).forEach(ln => { if(ln.trim().length < 60 && TITLE_HINTS.some(h => ln.toLowerCase().includes(h))) pushTitle(ln); });
  [expText, secText("preamble")].join("\n").split("\n").forEach(ln => {
    const l = ln.toLowerCase();
    if(ln.length > 4 && ln.length < 70 && ln.trim().split(/\s+/).length <= 6 && !/^\s*[-•*]/.test(ln)
       && !ln.includes("—") && !ln.includes("|") && TITLE_HINTS.some(h => l.includes(h))
       && !/^(b\.s\.|b\.a\.|m\.s\.|mba|ph\.d|bsn)/i.test(ln.trim())){
      pushTitle(ln);
    }
  });
  /* skills: strong vocabulary anywhere; ambiguous everyday words only inside the Skills section */
  const skills = SKILL_WORDS.filter(s => hasWord(low, s));
  if(skillsText) AMBIGUOUS_SKILLS.forEach(s => { if(hasWord(skillsText.toLowerCase(), s)) skills.push(s); });
  /* years of experience: month-name and bare-year ranges, earliest start to latest end */
  const MON = "(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
  const rangeRe = new RegExp(MON+"?\\.?\\s*(19|20)\\d{2}\\s*(?:-|–|—|to)\\s*(?:"+MON+"?\\.?\\s*(?:(19|20)\\d{2}|present|current|now))", "gi");
  let earliest = null, latest = null;
  while((m = rangeRe.exec(clean)) !== null){
    const ys = m[0].match(/(19|20)\d{2}/g);
    if(ys){ const a = parseInt(ys[0],10); if(earliest===null || a<earliest) earliest = a; }
    if(/present|current|now/i.test(m[0])) latest = new Date().getFullYear();
    else if(ys && ys.length>1){ const b = parseInt(ys[ys.length-1],10); if(latest===null || b>latest) latest = b; }
  }
  let yearsExp = "";
  if(earliest !== null && latest !== null && latest >= earliest) yearsExp = String(latest - earliest);
  /* industries: strong sources (name block, summary, skills, employers, titles) decide;
     experience-bullet mentions need at least two distinct keyword hits, so one incidental
     word ("hospitals" in an engineer's bullet) never spawns a sector lane */
  const strongText = [secText("preamble"), summaryText, skillsText, employers.join("\n"), heldTitles.join("\n")].join("\n").toLowerCase();
  const weakLow = expText.toLowerCase();
  const industries = Object.keys(INDUSTRY_WORDS).filter(ind => {
    const kws = INDUSTRY_WORDS[ind];
    if(kws.some(w => hasWord(strongText, w))) return true;
    return kws.filter(w => hasWord(weakLow, w)).length >= 2;
  });
  return {
    skills: uniq(skills).slice(0, 40),
    employers: employers.slice(0, 15),
    titles: heldTitles.slice(0, 12),
    industries: industries,
    years_experience: yearsExp,
    summary: ""
  };
}

/* Best-effort text from an uploaded file: .txt directly; .pdf/.docx naive string scan; paste fallback always offered. */
async function extractFileText(file){
  const name = (file.name||"").toLowerCase();
  if(name.endsWith(".txt") || file.type === "text/plain") return await file.text();
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  /* collect printable runs — works well enough for many PDFs/DOCXs to seed detection; user can paste instead */
  let out = "", run = "";
  for(let i=0;i<bytes.length;i++){
    const c = bytes[i];
    if(c >= 32 && c < 127 || c === 10 || c === 13){ run += String.fromCharCode(c); }
    else { if(run.length >= 4) out += run + "\n"; run = ""; }
  }
  if(run.length >= 4) out += run;
  return out.slice(0, 200000);
}

/* ---------- wide coverage generation ---------- */
const SENIORITY = ["", "Senior ", "Lead ", "Principal ", "Staff "];
const ROLE_FAMILIES = [
  { keys:["nurse","nursing"], family:["Nurse","Registered Nurse","ICU Nurse","ER Nurse","Charge Nurse","Clinical Nurse","Staff Nurse","Telemetry Nurse","Critical Care Nurse","Nurse Practitioner"] },
  { keys:["analyst"], family:["Analyst","Business Analyst","Systems Analyst","Data Analyst","Business Systems Analyst","Functional Analyst","Reporting Analyst"] },
  { keys:["marketing"], family:["Marketing Manager","Digital Marketing Manager","Brand Manager","Content Marketing Manager","Demand Generation Manager","Product Marketing Manager","Growth Marketing Manager","Campaign Manager","Marketing Specialist","Marketing Director"] },
  { keys:["architect"], family:["Architect","Solutions Architect","Enterprise Architect","Cloud Architect","Infrastructure Architect","Application Architect","Technical Architect"] },
  { keys:["engineer"], family:["Engineer","Mechanical Engineer","Design Engineer","Manufacturing Engineer","Project Engineer","Systems Engineer","Cloud Engineer","Infrastructure Engineer","Platform Engineer","Support Engineer","DevOps Engineer"] },
  { keys:["designer"], family:["Designer","Product Designer","UX Designer","UI Designer","Interaction Designer","Visual Designer"] },
  { keys:["manager"], family:["Manager","Program Manager","Project Manager","Product Manager","Operations Manager","Delivery Manager"] },
  { keys:["director"], family:["Director","Project Director","Program Director","Operations Director","Managing Director","Director of Operations","Associate Director","Executive Director","Senior Director"] },
  { keys:["developer"], family:["Developer","Software Developer","Application Developer","Full Stack Developer","Web Developer"] },
  { keys:["consultant"], family:["Consultant","Solutions Consultant","Technical Consultant","Implementation Consultant","Advisory Consultant"] },
  { keys:["administrator"], family:["Administrator","Systems Administrator","Cloud Administrator","Network Administrator","Database Administrator"] },
  { keys:["specialist"], family:["Specialist","Technical Specialist","Implementation Specialist","Support Specialist","Operations Specialist"] },
  { keys:["scientist"], family:["Scientist","Data Scientist","Research Scientist","Applied Scientist"] },
  { keys:["technician"], family:["Technician","Support Technician","Field Technician","Systems Technician"] },
  { keys:["coordinator"], family:["Coordinator","Program Coordinator","Project Coordinator","Operations Coordinator"] },
  { keys:["therapist"], family:["Therapist","Physical Therapist","Occupational Therapist","Respiratory Therapist","Speech Therapist"] }
];
function familyForTitle(title){
  const low = String(title||"").toLowerCase();
  for(const rf of ROLE_FAMILIES){ if(rf.keys.some(k => low.includes(k))) return rf.family; }
  return null;
}
/* career-field words: when the title itself names a field ("Healthcare Project Director",
   "Data Analyst"), the generated set carries field-flavored variants of the family forms,
   so the titles match the user's actual field instead of generic roles */
const FIELD_WORDS = ["healthcare","clinical","medical","data","cloud","digital","marketing","product",
  "software","security","cyber","financial","finance","operations","business","technical","information",
  "mechanical","electrical","civil","industrial","quality","customer","sales","energy","retail","legal",
  "content","brand","growth","platform","infrastructure","network","systems","enterprise","solutions",
  "application","research","human"];
function titleFieldWord(title){
  const words = String(title||"").toLowerCase().split(/[^a-z]+/).filter(Boolean)
    .filter(w => !["senior","lead","principal","staff","junior","sr","jr"].includes(w));
  if(words.length && FIELD_WORDS.includes(words[0])) return words[0][0].toUpperCase() + words[0].slice(1);
  return "";
}
function generateTitles(specifiedTitle, detection){
  const title = String(specifiedTitle||"").trim();
  const family = familyForTitle(title);
  const headWord = title.toLowerCase().split(/[^a-z]+/).filter(Boolean).pop() || "";
  let out = [];
  if(title) out.push(title);
  const fieldWord = titleFieldWord(title);
  if(family && fieldWord){
    /* field-flavored variants first, so they survive the cap: "Healthcare Program Director", "Data Systems Analyst" */
    family.forEach(f => {
      if(!f.toLowerCase().includes(fieldWord.toLowerCase())) out.push(fieldWord + " " + f);
    });
  }
  if(family){
    family.forEach(f => {
      /* a bare head noun ("Analyst") IS the specified title once its domain word is on it —
         composing domain + family blindly produced "Data Analyst Analyst" */
      const composed = (f.split(" ").length === 1 && f.toLowerCase() === headWord) ? title : f;
      SENIORITY.forEach(p => out.push(p + composed));
    });
  }
  /* fold in the titles the resume actually held */
  (detection.titles||[]).forEach(t => out.push(t));
  if(!family){
    /* no known family: seniority variants of the title itself, plus the families of titles actually held */
    SENIORITY.forEach(p => { if(p && title) out.push(p + title); });
    (detection.titles||[]).forEach(t => {
      const hf = familyForTitle(t);
      if(hf) hf.forEach(f => SENIORITY.forEach(p => out.push(p + f)));
    });
  }
  const tidy = arr => uniq(arr.map(t => t.replace(/\b(\w+)(\s+\1\b)+/gi, "$1")))
    .filter(t => t.length >= 3 && t.length <= 60);
  out = tidy(out);
  if(out.length < 20 && family){
    /* widen: bare family forms at every seniority level */
    family.forEach(f => SENIORITY.forEach(p => out.push(p + f)));
    out = tidy(out);
  }
  return out.slice(0, 35);
}
const BOARD_LANES = [
  { name:"LinkedIn", sites:["LinkedIn (linkedin.com/jobs)"] },
  { name:"Indeed", sites:["Indeed (indeed.com)"] },
  { name:"Dice", sites:["Dice (dice.com)"] },
  { name:"Glassdoor", sites:["Glassdoor (glassdoor.com)"] },
  { name:"Monster", sites:["Monster (monster.com)"] },
  { name:"ZipRecruiter", sites:["ZipRecruiter (ziprecruiter.com)"] },
  { name:"SimplyHired", sites:["SimplyHired (simplyhired.com)"] },
  { name:"Google Jobs", sites:["Google Jobs (google.com/search jobs)"] },
  { name:"Company Career Sites", sites:["Employer career pages (from your target employer list)"] }
];
function generateLanes(detection, targetEmployers, titleField){
  const lanes = [];
  /* sector lanes from detected industries */
  (detection.industries||[]).forEach(ind => {
    const inSector = (targetEmployers||[]).filter(e =>
      (INDUSTRY_WORDS[ind]||[]).some(w => e.toLowerCase().includes(w)));
    const pool = uniq([].concat(inSector, (detection.employers||[]).slice(0,8)));
    lanes.push({ id: uid("lane"), name: ind + " employers", kind:"sector",
      sites: pool.length? pool : ["Employers in the " + ind + " sector (add target employers in the wizard)"] });
  });
  /* the career field named in the title ALWAYS gets its lane, first in the grid: if none of the
     detected industries corresponds to it, prepend a field lane — a healthcare title must never
     end up with only some other field's lane showing */
  if(titleField){
    const stem = titleField.toLowerCase().slice(0, 6);
    const hasFieldLane = lanes.some(l => l.kind === "sector" && l.name.toLowerCase().includes(stem));
    if(!hasFieldLane){
      const pool = uniq([].concat(targetEmployers||[], (detection.employers||[]).slice(0,8)));
      lanes.unshift({ id: uid("lane"), name: titleField + " employers", kind:"sector",
        sites: pool.length? pool : ["Employers in the " + titleField + " field (add target employers in the wizard)"] });
    }
  }
  /* one lane for the target employer list itself when no sector matched */
  if(!lanes.length && (targetEmployers||[]).length){
    lanes.push({ id: uid("lane"), name:"Target employers", kind:"sector", sites: uniq(targetEmployers) });
  }
  BOARD_LANES.forEach(b => lanes.push({ id: uid("lane"), name: b.name, kind:"board", sites: b.sites.slice() }));
  return lanes;
}
async function generateCoverage(specifiedTitle){
  const det = STORE.profile.detection || {};
  let titles = generateTitles(specifiedTitle, det);
  let lanes = generateLanes(det, STORE.profile.employers.target || [], titleFieldWord(specifiedTitle));
  let widened = false;
  if(titles.length < 20 || lanes.length < 9){
    /* automatic widening pass: generate from every title the resume actually held —
       real held titles widen the set without inventing roles */
    let extra = [];
    (det.titles||[]).forEach(t => { extra = extra.concat(generateTitles(t, det)); });
    titles = uniq(titles.concat(extra)).slice(0, 35);
    widened = true;
  }
  STORE.coverage.specified_title = specifiedTitle;
  STORE.coverage.draft = { titles, lanes, generated_at: nowISO() };
  await storeSave("coverage", "Save draft coverage");
  if(widened) await noteWorkaround("Generated coverage came back thin ("+titles.length+" titles, "+lanes.length+" lanes) — automatically widened with broader variants and merged.");
  await logActivity("generation", "Generated a draft of "+titles.length+" titles and "+lanes.length+" lanes from the title “"+esc(specifiedTitle)+"”.");
  return STORE.coverage.draft;
}

function completeness(){
  const p = STORE.profile, c = STORE.coverage, a = STORE.answers, r = STORE.rules, cn = STORE.connections;
  const has = v => v != null && String(v).trim() !== "";
  const sections = [
    { id:"contact",  label:"Name & contact", step:1, ok: has(p.name) && has(p.email) && has(p.phone),
      detail: [p.name, p.email, p.phone].filter(Boolean).join(" · ") || "Nothing saved yet" },
    { id:"address",  label:"Home address", step:2, ok: has(p.address.street) && has(p.address.city) && has(p.address.state),
      detail: [p.address.street, p.address.city, p.address.state, p.address.zip].filter(Boolean).join(", ") || "Nothing saved yet" },
    { id:"resume",   label:"Resume & experience detection", step:3, ok: has(p.resume.text),
      detail: p.resume.text? ("Resume on file"+(p.detection && p.detection.years_experience? " · ~"+p.detection.years_experience+" yrs detected":"")+" · "+((p.detection&&p.detection.skills||[]).length)+" skills") : "No resume saved yet" },
    { id:"coverage", label:"Title & saved coverage", step:4, ok: (c.saved.titles||[]).length > 0 && (c.saved.lanes||[]).length > 0,
      detail: (c.saved.titles||[]).length? ((c.saved.titles.length)+" titles · "+(c.saved.lanes.length)+" lanes · saved "+fmtDate(c.saved.saved_at)) : "No saved coverage yet — drafts do not count" },
    { id:"linkedin", label:"LinkedIn", step:5, ok: has(cn.linkedin.profile_url),
      detail: cn.linkedin.profile_url || "No profile URL saved yet" },
    { id:"mailbox",  label:"Mailbox for codes & resets", step:6, ok: has(cn.mailbox.provider),
      detail: cn.mailbox.provider? (cn.mailbox.provider + (cn.mailbox.email? " · "+cn.mailbox.email : "")) : "No mailbox connected yet" },
    { id:"employers",label:"Employer lists", step:7, ok: (p.employers.target||[]).length > 0,
      detail: (p.employers.target||[]).length? ((p.employers.target.length)+" target · "+(p.employers.excluded.length)+" excluded") : "No target employers yet" },
    { id:"salary",   label:"Salary figures", step:8, ok: has(a.salary.range) || has(a.salary.single_figure) || has(a.salary.contract_hourly),
      detail: [a.salary.range, a.salary.single_figure && ("single: "+a.salary.single_figure), a.salary.contract_hourly && ("contract: "+a.salary.contract_hourly+"/hr")].filter(Boolean).join(" · ") || "Nothing saved yet" },
    { id:"rules",    label:"Hunt rules", step:9, ok: true,
      detail: (r.remote_only? "Remote only" : "Any location") + (r.minimum_pay? " · min "+r.minimum_pay : "") + ((r.focus_sectors||[]).length? " · focus: "+r.focus_sectors.join(", ") : "") },
    { id:"answers",  label:"Screening answers", step:10, ok: has(a.screening.work_authorization),
      detail: a.screening.work_authorization? "Saved — authorization, sponsorship, veteran status and more on file" : "Not answered yet" }
  ];
  const done = sections.filter(s => s.ok).length;
  return { sections, done, total: sections.length, complete: done === sections.length };
}

async function onConnect(){
  const owner = $("#ghOwner").value.trim(), repo = $("#ghRepo").value.trim(), token = $("#ghToken").value.trim();
  if(!owner || !repo || !token){ banner("Fill in owner, repo, and token to connect.", "warn"); return; }
  const btn = $("#btnConnect"); setBusy(btn, true, "Connecting…");
  GH = { owner, repo, token };
  try{
    const res = await ghFetch("/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo));
    if(res.status === 404) throw new Error("Repo not found. Check the owner and repo name — and that the repo exists and is accessible with this token.");
    if(res.status === 401 || res.status === 403) throw new Error("GitHub rejected that token ("+res.status+"). Make sure it is a fine-grained token with Contents read & write on this repo.");
    if(!res.ok) throw new Error("GitHub returned "+res.status+" while opening the repo.");
    ghSave();
    const created = await storeInit();
    await storeLoad();
    if(created.length) await logActivity("setup", "Initialized the data store in "+owner+"/"+repo+": created "+created.join(", ")+".");
    banner("");
    const hasProfile = STORE.profile && (STORE.profile.name || STORE.profile.resume.text);
    if(hasProfile){ renderVerify(); }
    else { renderWizard(1); }
  }catch(e){
    GH = null; ghClear();
    setBusy(btn, false);
    renderConnect({owner, repo, token}, e.message || String(e));
  }
}
function disconnect(){
  ghClear(); mailTokenClear(); STORE = null;
  banner("Disconnected. Your token was cleared from this browser — your data stays in your repo, untouched.", "ok");
  renderConnect(null, "");
}

/* ---------- signup wizard (11 steps) ---------- */
const WIZ_STEPS = ["Contact","Address","Resume","Title & coverage","LinkedIn","Mailbox","Employers","Salary","Rules","Answers","Review & save"];
let WIZ = 1;
function wizShell(step, inner){
  const dots = WIZ_STEPS.map((s,i)=>{
    const n = i+1;
    return '<div class="stepdot '+(n===step?"on":(n<step?"done":""))+'" title="'+esc(s)+'">'+n+'</div>';
  }).join("");
  view().innerHTML = `
  <div class="card">
    <div class="flexbetween">
      <p class="label">Set up your hunt · Step ${step} of 11</p>
      <button class="btn ghost small" id="wizExit" type="button">✕ Exit to dashboard</button>
    </div>
    <h2 style="margin:0 0 4px;font-size:21px">${esc(WIZ_STEPS[step-1])}</h2>
    <div class="steps mt">${dots}</div>
    <div id="wizBody">${inner}</div>
    <div class="flexbetween mt">
      <button class="btn ghost" id="wizBack" ${step===1?"disabled":""}>← Back</button>
      <span class="sub small">Progress saves to your repo as you go.</span>
      <button class="btn" id="wizNext">${step===11? "Save everything" : "Save & continue →"}</button>
    </div>
  </div>`;
  $("#wizBack").addEventListener("click", ()=> renderWizard(Math.max(1, step-1)));
  $("#wizNext").addEventListener("click", ev => wizNext(step, ev.currentTarget));
  const wx = $("#wizExit"); if(wx) wx.addEventListener("click", () => renderDashboard());
}
function renderWizard(step){
  WIZ = step;
  headActions('<button class="btn ghost small" id="btnHeadDisc">Disconnect</button>');
  const d = $("#btnHeadDisc"); if(d) d.addEventListener("click", disconnect);
  const renderers = {1:wizStep1,2:wizStep2,3:wizStep3,4:wizStep4,5:wizStep5,6:wizStep6,7:wizStep7,8:wizStep8,9:wizStep9,10:wizStep10,11:wizStep11};
  (renderers[step] || wizStep1)();
}
async function wizPersist(step){
  try{
    if(step <= 3 || step === 7) await storeSave("profile", "Wizard step "+step+" (profile)");
    if(step === 4) await storeSave("coverage", "Wizard step 4 (coverage)");
    if(step === 5 || step === 6) await storeSave("connections", "Wizard step "+step+" (connections)");
    if(step === 8 || step === 10) await storeSave("answers", "Wizard step "+step+" (answers)");
    if(step === 9) await storeSave("rules", "Wizard step 9 (rules)");
    STORE.profile.wizard_step = Math.max(STORE.profile.wizard_step||1, Math.min(11, step+1));
    if(step !== 3 && step !== 7 && step !== 1 && step !== 2) await storeSave("profile", "Wizard progress");
  }catch(e){ banner("Saving to your repo hit a problem: "+esc(e.message||String(e))+" — your entries are still on this screen; try Continue again.", "err"); throw e; }
}
async function wizNext(step, btn){
  const collect = {1:collect1,2:collect2,3:collect3,4:collect4,5:collect5,6:collect6,7:collect7,8:collect8,9:collect9,10:collect10,11:collect11}[step];
  if(collect) collect();
  setBusy(btn, true, "Saving…");
  try{
    await wizPersist(step);
    banner("");
    if(step === 11){ toast("Saved to your repo and verified."); renderVerify(); return; }
    renderWizard(step+1);
  }catch(e){ setBusy(btn, false); }
}

function laneProgress(lane){
  const runs = STORE.runs;
  const entry = ((runs.current_run && runs.current_run.lanes) || []).find(x => x.name === lane.name);
  if(entry && entry.total) return Math.max(0, Math.min(100, Math.round(100 * (entry.done||0) / entry.total)));
  if(runs.state === "idle" && runs.history && runs.history.length) return 100;
  return 0;
}
function openLanePanel(idx){
  const saved = STORE.coverage.saved || { lanes:[] };
  const lane = (saved.lanes||[])[idx]; if(!lane) return;
  const runs = STORE.runs;
  const list = lane.sites.map((s,i)=>"<li>"+esc(s)+"</li>").join("");
  $("#lanePanel").innerHTML = `
  <div class="card mt">
    <div class="flexbetween"><h3 style="margin:0">${esc(lane.name)}</h3>

        <button class="btn ghost small" id="btnLaneClose">Close</button>
      </div>

    <p class="sub">${laneProgress(lane)}% covered · run state: ${esc(runs.state)}</p>

  $("#btnLaneClose").addEventListener("click", () => { $("#lanePanel").innerHTML = ""; });
  $("#btnLanePriority").addEventListener("click", () => laneControl(lane, "priority"));

async function laneControl(lane, action){
  try{
    STORE.runs.lane_controls = Array.isArray(STORE.runs.lane_controls)? STORE.runs.lane_controls: [];
    STORE.runs.lane_controls.push({ id: uid("ctl"), lane: lane.name, action, at: nowISO() });
    await storeSave("runs", "Lane control: "+action+" "+lane.name);
    await logActivity("control", "Lane control recorded: "+action+" on “"+lane.name+"” — written into runs.json for the next run.");
    const m = $("#laneCtlMsg"); if(m) m.innerHTML = '<div class="notice ok">'+esc(action === "priority"? "Priority toggled" : "Restart requested")+' for '+esc(lane.name)+' — saved in runs.json.</div>';
  }catch(e){ const m = $("#laneCtlMsg"); if(m) m.innerHTML = '<div class="notice err">'+esc(e.message||String(e))+'</div>'; }
}
async function startRun(){
  if(!(STORE.coverage.saved.titles||[]).length){ toast("Save a coverage set first — runs use your saved set only."); renderWizard(4); return; }
  STORE.runs.state = "running";
  STORE.runs.current_run = { id: uid("run"), started_at: nowISO(),
    titles: clone(STORE.coverage.saved.titles), lanes: clone(STORE.coverage.saved.lanes), evaluated_extra: 0 };
  try{
    await storeSave("runs", "Start run");
    await logActivity("run", "Run started on the saved coverage set ("+STORE.runs.current_run.titles.length+" titles, "+STORE.runs.current_run.lanes.length+" lanes).");
    renderDashboard();
  }catch(e){ banner("Could not start the run: "+esc(e.message||String(e)), "err"); }

  try{ await storeSave("runs", "Stop run"); await logActivity("run", "Run stopped by user."); renderDashboard(); }
  catch(e){ banner("Could not stop the run: "+esc(e.message||String(e)), "err"); }
}

async function saveFiling(){
  const company = $("#afCompany").value.trim(), role = $("#afRole").value.trim();
  if(!company || !role){ toast("Company and role are required."); return; }
  const r = STORE.rules;
  const record = { id: uid("fil"), company, role,
    where: $("#afWhere").value.trim(), status: $("#afStatus").value,
    filed_at: nowISO(), date: todayStr(), reason: $("#afReason").value.trim(),
    check: { verdict:"recorded", rules: [
      { rule:"Full job description read before deciding", status:"pass", evidence:"Recorded by user" },
      { rule:"Remote-only rule ("+(r.remote_only? "on":"off")+")", status:"pass", evidence:"Rule state from rules.json" },
      { rule:"Minimum pay ("+(r.minimum_pay || "none set")+")", status:"pass", evidence:"Rule state from rules.json" },
      { rule:"Not on the excluded-employer list", status: (STORE.profile.employers.excluded||[]).some(e => e.toLowerCase() === company.toLowerCase())? "fail":"pass", evidence:"Checked against profile.json employer lists" },
      { rule:"No duplicate application to the same posting", status:"pass", evidence:"Checked against filings.json" }
    ] } };
  STORE.filings.filings = Array.isArray(STORE.filings.filings)? STORE.filings.filings: [];
  STORE.filings.filings.unshift(record);
  try{
    await storeSave("filings", "Record filing: "+company+" — "+role);
    await logActivity("filing", "Recorded a "+record.status+" application: "+company+" — "+role+" ("+(record.where||"route not noted")+").");
    renderDashboard();
  }catch(e){ banner("Saving the filing failed: "+esc(e.message||String(e)), "err"); }
}
async function requestRework(filingId, kind){
  const f = (STORE.filings.filings||[]).find(x => x.id === filingId);
  if(!f) return;
  try{
    STORE.runs.requests = Array.isArray(STORE.runs.requests)? STORE.runs.requests: [];
    STORE.runs.requests.push({ id: uid("req"), filing_id: f.id, company: f.company, role: f.role, kind, at: nowISO(), workaround_chain: WORKAROUND_CHAIN.slice() });
    await storeSave("runs", (kind === "relaunch"? "Relaunch" : "Retry")+": "+f.company);
    await logActivity("workaround", (kind === "relaunch"? "Relaunch" : "Retry")+" requested for "+f.company+" — "+f.role+". Workaround chain queued: (1) "+WORKAROUND_CHAIN[0]+"; (2) "+WORKAROUND_CHAIN[1]+"; (3) "+WORKAROUND_CHAIN[2]+".");
    toast((kind === "relaunch"? "Relaunch" : "Retry")+" recorded in runs.json, with the workaround chain noted.");
    renderFilings();
  }catch(e){ banner("Could not record that request: "+esc(e.message||String(e)), "err"); }
}

/* ---------- mailbox sign-in + automatic code fetching ----------
   The user signs in with their provider: Google/Microsoft run the sign-in on their own pages and
   hand this page a read-only mail token. Tokens live ONLY in this browser (localStorage), never
   in the repo — the same rule as the GitHub token. connections.json records the provider, email
   and the app-registration client ID (an identifier, not a secret) so setup survives. */
const MAIL_KEY = "getMeAJobMail";
function mailTokenLoad(){ try{ const raw = localStorage.getItem(MAIL_KEY); return raw? JSON.parse(raw) : null; }catch(e){ return null; } }
function mailTokenSave(t){ try{ localStorage.setItem(MAIL_KEY, JSON.stringify(t)); }catch(e){} }
function mailTokenClear(){ try{ localStorage.removeItem(MAIL_KEY); }catch(e){} }
function mailTokenValid(){
  const t = mailTokenLoad();
  if(!t || !t.provider) return null;
  if(t.provider === "Outlook") return t; /* MSAL manages its own token lifecycle */
  return (t.access_token && (!t.expires_at || Date.now() < t.expires_at - 30000))? t : null;
}
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Could not load " + src));
    (document.head || document.documentElement).appendChild(s);
  });
}
/* --- Gmail (Google Identity Services token client; read-only scope) --- */
async function ensureGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return;
  await loadScriptOnce("https://accounts.google.com/gsi/client");
  if(!(window.google && google.accounts && google.accounts.oauth2)) throw new Error("Google sign-in did not load — check your connection and try again.");
}
function gisToken(clientId, prompt){
  return new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: "https://www.googleapis.com/auth/gmail.readonly",
      callback: resp => { if(resp && resp.access_token) resolve(resp); else reject(new Error("Google sign-in was cancelled or did not return a token.")); },
      error_callback: err => reject(new Error("Google sign-in failed (" + ((err && err.type) || "unknown") + ")."))
    });
    client.requestAccessToken({ prompt: prompt || "" });
  });
}
async function connectGmail(clientId){
  await ensureGis();
  const token = await gisToken(clientId, "consent");
  mailTokenSave({ provider:"Gmail", access_token: token.access_token, expires_at: Date.now() + (token.expires_in || 3600) * 1000 });
  const prof = await gmailApi("/profile");
  const mb = STORE.connections.mailbox;
  if(prof && prof.emailAddress) mb.email = prof.emailAddress;
  mb.connected = true; mb.connected_at = nowISO();
  await storeSave("connections", "Connect Gmail mailbox");
  return mb.email;
}
async function reauthGmail(clientId){
  await ensureGis();
  const token = await gisToken(clientId, "");
  mailTokenSave({ provider:"Gmail", access_token: token.access_token, expires_at: Date.now() + (token.expires_in || 3600) * 1000 });
}
function gmailApi(path, token){
  const t = token || (mailTokenLoad() || {}).access_token;
  return fetch("https://gmail.googleapis.com/gmail/v1/users/me" + path, { headers:{ Authorization: "Bearer " + t } })
    .then(r => { if(!r.ok) throw new Error("Gmail API answered " + r.status + " — reconnect your mailbox if this persists."); return r.json(); });
}
/* --- Outlook (MSAL public client; read-only scopes; PKCE, no secret) --- */
let MSAL_APP = null;
async function ensureMsal(clientId){
  if(!(window.msal && msal.PublicClientApplication)){
    await loadScriptOnce("https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js");
  }
  if(!(window.msal && msal.PublicClientApplication)) throw new Error("Microsoft sign-in did not load — check your connection and try again.");
  if(!MSAL_APP){
    MSAL_APP = new msal.PublicClientApplication({
      auth: { clientId: clientId, redirectUri: location.href.split("#")[0].split("?")[0] },
      cache: { cacheLocation: "localStorage" }
    });
    await MSAL_APP.initialize();
  }
  return MSAL_APP;
}
async function connectOutlook(clientId){
  const app = await ensureMsal(clientId);
  const login = await app.loginPopup({ scopes: ["User.Read", "Mail.Read"] });
  const account = login.account || app.getAllAccounts()[0];
  if(account) app.setActiveAccount(account);
  const mb = STORE.connections.mailbox;
  if(account && account.username) mb.email = account.username;
  mb.connected = true; mb.connected_at = nowISO();
  mailTokenSave({ provider:"Outlook", access_token:"msal", expires_at: 0 });
  await storeSave("connections", "Connect Outlook mailbox");
  return mb.email;
}
async function outlookToken(){
  const mb = STORE.connections.mailbox;
  const app = await ensureMsal(mb.client_id);
  const account = app.getActiveAccount() || app.getAllAccounts()[0];
  if(!account) throw new Error("Outlook session expired — reconnect your mailbox from the Code Inbox.");
  try{ const r = await app.acquireTokenSilent({ scopes:["Mail.Read"], account: account }); return r.accessToken; }
  catch(e){ const r = await app.acquireTokenPopup({ scopes:["Mail.Read"], account: account }); return r.accessToken; }
}
function graphApi(path, token){
  return fetch("https://graph.microsoft.com/v1.0" + path, { headers:{ Authorization: "Bearer " + token } })
    .then(r => { if(!r.ok) throw new Error("Microsoft Graph answered " + r.status + " — reconnect your mailbox if this persists."); return r.json(); });
}
async function connectMailbox(){
  const mb = STORE.connections.mailbox;
  if(!mb.provider) throw new Error("Choose your provider first.");
  if(mb.provider === "Other") throw new Error("Automatic code fetching supports Gmail and Outlook. Other mailboxes keep the manual fallback in the Code Inbox.");
  if(!mb.client_id) throw new Error("Paste your provider app's client ID first — it comes from the free one-time setup above.");
  if(mb.provider === "Gmail") return connectGmail(mb.client_id);
  if(mb.provider === "Outlook") return connectOutlook(mb.client_id);
  throw new Error("Unknown provider: " + mb.provider);
}
/* --- code extraction + fetching --- */
function extractCodeFromText(text){
  const t = String(text || "");
  const pats = [
    /(?:verification|security|one[- ]?time|access|sign[- ]?in|login|confirmation|authentication)[^0-9a-z]{0,40}?(\d{4,8})\b/i,
    /\bcode[^0-9a-z]{0,20}?(\d{4,8})\b/i,
    /\b(\d{6})\b/
  ];
  for(const p of pats){ const m = t.match(p); if(m) return m[1]; }
  return "";
}
function serviceName(from){
  const s = String(from || "");
  const named = s.match(/^"?([^"<@]+?)"?\s*</);
  if(named && named[1].trim()) return named[1].trim();
  const dom = s.match(/@([a-z0-9.-]+)/i);
  return dom? dom[1].replace(/^www\./, "") : "Mailbox";
}
async function gmailFetchCodes(token){
  const q = encodeURIComponent('newer_than:2d (verification OR code OR "one-time" OR passcode OR otp OR "sign-in" OR security)');
  const list = await gmailApi("/messages?maxResults=12&q=" + q, token);
  const out = [];
  for(const m of (list.messages || [])){
    const msg = await gmailApi("/messages/" + m.id + "?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date", token);
    const headers = {};
    (((msg.payload || {}).headers) || []).forEach(h => { headers[String(h.name).toLowerCase()] = h.value; });
    const code = extractCodeFromText((headers.subject || "") + " " + (msg.snippet || ""));
    if(!code) continue;
    let when = nowISO();
    if(headers.date){ const d = new Date(headers.date); if(!isNaN(d)) when = d.toISOString(); }
    out.push({ service: serviceName(headers.from || ""), code: code, received_at: when });
  }
  return out;
}
async function graphFetchCodes(token){
  const data = await graphApi("/me/messages?$top=15&$orderby=receivedDateTime%20desc&$select=subject,from,receivedDateTime,bodyPreview", token);
  const out = [];
  (data.value || []).forEach(msg => {
    const hay = (msg.subject || "") + " " + (msg.bodyPreview || "");
    if(!/code|verif|one-time|otp|passcode|sign-in|security/i.test(hay)) return;
    const code = extractCodeFromText(hay);
    if(!code) return;
    const ea = (msg.from && msg.from.emailAddress) || {};
    out.push({ service: serviceName(ea.name || ea.address || ""), code: code, received_at: msg.receivedDateTime || nowISO() });
  });
  return out;
}
async function fetchMailboxCodes(opts){
  opts = opts || {};
  const mb = STORE.connections.mailbox;
  if(!mb || !mb.connected) return { added: 0, reason: "not-connected" };
  let found = [];
  if(mb.provider === "Gmail"){
    let tok = mailTokenValid();
    if(!tok || tok.provider !== "Gmail"){
      try{ await reauthGmail(mb.client_id); tok = mailTokenValid(); }
      catch(e){ return { added: 0, reason: "reauth" }; }
    }
    if(!tok) return { added: 0, reason: "reauth" };
    found = await gmailFetchCodes(tok.access_token);
  } else if(mb.provider === "Outlook"){
    found = await graphFetchCodes(await outlookToken());
  } else return { added: 0, reason: "unsupported" };
  STORE.codes.codes = Array.isArray(STORE.codes.codes)? STORE.codes.codes : [];
  let added = 0;
  found.forEach(f => {
    const dupe = STORE.codes.codes.some(c => c.code === f.code && (c.service || "") === f.service
      && String(c.received_at || "").slice(0, 10) === String(f.received_at || "").slice(0, 10));
    if(!dupe){ STORE.codes.codes.unshift({ id: uid("code"), service: f.service, code: f.code, received_at: f.received_at, note: "Fetched automatically from " + mb.provider }); added++; }
  });
  STORE.codes.codes.sort((a, b) => String(b.received_at || "").localeCompare(String(a.received_at || "")));
  mb.last_checked_at = nowISO();
  if(added){
    await storeSave("codes", "Fetch mailbox codes");
    await storeSave("connections", "Mailbox code check");
    await logActivity("code", added + " new code" + (added === 1? "" : "s") + " fetched automatically from " + mb.provider + ".");
  }
  return { added: added };
}

/* ---------- code inbox ---------- */
function renderCodes(){
  const box = $("#codesBox"); if(!box) return;
  const codes = STORE.codes.codes || [];
  const mb = STORE.connections.mailbox || {};
  const tok = mailTokenLoad();
  const live = !!(mb.connected && tok && tok.provider === mb.provider && mailTokenValid());
  const stateLine = live
    ? "Connected to " + esc(mb.provider) + (mb.email? " as " + esc(mb.email) : "") + " — one-time sign-in codes and password-reset codes are fetched automatically." + (mb.last_checked_at? " Last checked " + esc(fmtDateTime(mb.last_checked_at)) + "." : "")
    : mb.connected
      ? "Your mailbox is set up, but its sign-in token is not live in this browser right now — reconnect to resume automatic fetching."
      : "Connect your mailbox and one-time codes land here automatically — fetched by the system, never pasted by you.";
  box.innerHTML = `
  <div class="card" style="margin:0">
    <p class="label">Code inbox</p>
    <p class="sub small">${stateLine}</p>
    ${codes.length? codes.map(c => '<div class="toggle"><div><b>'+esc(c.service||"Code")+'</b> <span class="mono">'+esc(c.code)+'</span><div class="sub small">'+esc(fmtDateTime(c.received_at))+(c.note? " · "+esc(c.note) : "")+'</div></div></div>').join("") : '<p class="sub">No codes yet.</p>'}
    <div class="mt">
      ${live? '<button class="btn ghost small" id="btnCheckMail">Check mailbox now</button> ' : '<button class="btn ghost small" id="btnGoConnectMail">'+(mb.connected? "Reconnect mailbox" : "Connect mailbox")+'</button> '}
      ${mb.connected? '<button class="btn ghost small" id="btnDiscMail">Disconnect mailbox</button>' : ""}
    </div>
    <details class="mt"><summary class="sub small" style="cursor:pointer">Got a code by text message instead? Add it manually</summary>
      <div class="grid2 mt">
        <div><label class="f">Service / site</label><input type="text" id="cdService" placeholder="e.g. a job board"></div>
        <div><label class="f">Code</label><input type="text" id="cdCode" placeholder="The code from the text"></div>
      </div>
      <div class="mt"><button class="btn ghost small" id="btnAddCode">Add to inbox</button></div>
    </details>
  </div>`;
  const chk = $("#btnCheckMail");
  if(chk) chk.addEventListener("click", async ev => {
    const btn = ev.currentTarget; setBusy(btn, true, "Checking…");
    try{
      const r = await fetchMailboxCodes({});
      if(r && r.reason === "reauth"){ toast("Mailbox sign-in expired — use Reconnect mailbox."); renderCodes(); }
      else { toast(r && r.added? r.added + " new code" + (r.added===1?"":"s") + " fetched." : "Mailbox checked — no new codes."); renderCodes(); }
    }catch(e){ banner("Checking the mailbox failed: "+esc(e.message||String(e)), "err"); }
    setBusy(btn, false);
  });
  const go = $("#btnGoConnectMail");
  if(go) go.addEventListener("click", () => renderWizard(6));
  const disc = $("#btnDiscMail");
  if(disc) disc.addEventListener("click", async () => {
    mailTokenClear();
    STORE.connections.mailbox.connected = false;
    try{ await storeSave("connections", "Disconnect mailbox"); }catch(e){}
    toast("Mailbox disconnected in this browser. Codes already fetched stay in your inbox.");
    renderCodes();
  });
  const addBtn = $("#btnAddCode");
  if(addBtn) addBtn.addEventListener("click", async () => {
    const service = $("#cdService").value.trim(), code = $("#cdCode").value.trim();
    if(!code){ toast("Type the code from the text message first."); return; }
    STORE.codes.codes = Array.isArray(STORE.codes.codes)? STORE.codes.codes: [];
    STORE.codes.codes.unshift({ id: uid("code"), service, code, received_at: nowISO(), note:"Added manually (text message)" });
    try{ await storeSave("codes", "Add code to inbox"); await logActivity("code", "A code for "+(service||"an unnamed service")+" was added to the code inbox manually."); renderCodes(); }
    catch(e){ banner("Saving the code failed: "+esc(e.message||String(e)), "err"); }
  });
}

/* ---------- activity ---------- */
function renderActivity(){
  const box = $("#activityBox"); if(!box) return;
  const entries = (STORE.activity.entries||[]).slice(0, 14);
  box.innerHTML = `
  <div class="card" style="margin:0">
    <p class="label">Activity — what the system did for itself</p>
    ${entries.length? entries.map(e => '<div class="toggle"><div><span class="pill '+(e.kind==="workaround"? "amber" : e.kind==="run"? "violet" : e.kind==="filing"? "green":"grey")+'">'+esc(e.kind)+'</span> <span class="small">'+esc(e.message)+'</span><div class="sub small">'+esc(fmtDateTime(e.at))+'</div></div></div>').join("") : '<p class="sub">Nothing yet. Saves, generations, retries and relaunches will be recorded here — in activity.json in your repo.</p>'}
  </div>`;
}

/* ---------- settings ---------- */
function renderSettings(){
  const box = $("#settingsBox"); if(!box) return;
  const p = STORE.profile || {}, cn = STORE.connections || {}, cov = STORE.coverage || {};
  const li = cn.linkedin || {}, mb = cn.mailbox || {};
  const saved = cov.saved || { titles:[], lanes:[] };
  const row = (label, value, pill, btn) => `
    <div class="toggle"><div><b>${label}</b><div class="sub small">${value}</div></div>
    <div>${pill || ""} ${btn || ""}</div></div>`;
  box.innerHTML = `
  <div class="card" id="settings">
    <p class="label">Settings</p>
    ${row("Data repo", '<span class="mono">'+esc(GH.owner)+"/"+esc(GH.repo)+'</span> — private repo holding everything this app knows about you',
      '<span class="pill green">connected</span>', "")}
    ${row("Signed in as", esc(p.name || "—") + (p.email? " · " + esc(p.email) : ""), "", '<button class="btn ghost small" id="btnSetProfile">Edit</button>')}
    ${row("LinkedIn", li.connected? "Connected" + (li.profile_url? " · " + esc(li.profile_url) : "") : "Not connected — applications work better with it",
      '<span class="pill '+(li.connected? "green":"grey")+'">'+(li.connected? "connected":"not connected")+'</span>', '<button class="btn ghost small" id="btnSetLinkedIn">Manage</button>')}
    ${row("Mailbox for codes", mb.connected? esc(mb.provider || "") + (mb.email? " · " + esc(mb.email) : "") + " — codes fetch automatically" : "Not connected — connect Gmail or Outlook and codes fetch themselves",
      '<span class="pill '+(mb.connected? "green":"grey")+'">'+(mb.connected? "connected":"not connected")+'</span>', '<button class="btn ghost small" id="btnSetMailbox">Manage</button>')}
    ${row("Saved coverage", (saved.titles||[]).length + " titles · " + (saved.lanes||[]).length + " lanes" + (cov.coverage_saved_at? " · saved " + esc(fmtDate(cov.coverage_saved_at)) : ""),
      "", '<button class="btn ghost small" id="btnSetCoverage">Manage</button>')}
    <div class="mt">
      <button class="btn ghost small" id="btnReVerify">Re-verify my details</button>
      <button class="btn ghost small" id="btnRedoWizard">Back to setup wizard</button>
      <button class="btn danger small" id="btnDisconnect">Disconnect (clears the tokens from this browser)</button>
    </div>
    <p class="sub small mt">Your data is stored as nine small files under <span class="mono">data/</span> in that repo (profile, coverage, rules, answers, connections, runs, filings, codes, activity) — and nowhere else. Sign-in tokens live only in this browser; disconnecting removes them and leaves your repo untouched.</p>
  </div>`;
  $("#btnDisconnect").addEventListener("click", disconnect);
  $("#btnReVerify").addEventListener("click", renderVerify);
  $("#btnRedoWizard").addEventListener("click", () => renderWizard(1));
  const sp = $("#btnSetProfile"); if(sp) sp.addEventListener("click", () => renderWizard(1));
  const sl = $("#btnSetLinkedIn"); if(sl) sl.addEventListener("click", () => renderWizard(5));
  const sm = $("#btnSetMailbox"); if(sm) sm.addEventListener("click", () => renderWizard(6));
  const sc = $("#btnSetCoverage"); if(sc) sc.addEventListener("click", () => renderWizard(4));
}

/* ---------- go ---------- */
let BOOTED = false;
function bootOnce(){ if(BOOTED) return; BOOTED = true; boot(); }
document.addEventListener("DOMContentLoaded", bootOnce);
if(document.readyState !== "loading") bootOnce();
</script>
